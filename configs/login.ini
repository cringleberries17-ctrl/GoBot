# GoBot auto-login
#
# The crossing from VTCZone to a character standing in the world.
#
# Between the two there are seven screens and not one of them is the game's:
# VTCZone's list of games and its "Choi game" button, then the client's own
# small launcher and its START button, a connect button, a channel list,
# another connect button, and a character to pick.
#
# NO ACCOUNT, NO PASSWORD. VTCZone keeps itself signed in: sign in to it once,
# with its own remember option, and from then on GoBot only presses Choi game,
# the way GoC does. If VTCZone shows its sign-in form instead, the crossing
# stops and says so, and nothing on that form is clicked or typed into. An
# older copy of this file may still have username= and password= lines, or a
# [Page.login_page]; they are ignored and left as they are.
#
# The sequence is fixed and is built into the program, and so are the
# pictures and measurements below, which is what it uses for a page left out
# of this file. What is NOT fixed is which picture identifies each page --
# those belong to the launchers and the client and change with them -- so
# this file is where a changed page is put right. A page whose picture is
# left blank stops the flow before it starts rather than halfway through.
#
# ---------------------------------------------------------------------------
# FILLING ONE IN AGAIN
# ---------------------------------------------------------------------------
# Get the launcher onto the page in question, then:
#
#   gobot_cli --window VTCZone --tplsrc "C:\Program Files\TH_VGO_Bot_Helper\TungHaVGOBot.dll" --survey
#
# It tries every picture in that set against what is on screen and prints the
# ones that match, with where they matched. Put the name here.
#
# --tplsrc can be any folder of PNGs or any assembly with pictures inside it.
# The launcher's pages are not in the game's own set, which is why this needs
# to be said at all.
#
# ---------------------------------------------------------------------------
# WHAT THIS DOES NOT DO
# ---------------------------------------------------------------------------
# It does not sign in to VTCZone, and keeps no account to sign in with.
#
# It does not answer a captcha. If one appears the flow stops and says so.
# That is somebody asking whether a person is there, and the answer is no.
#
# Nor a "Security Alert" box from the game's launcher, which is Windows asking
# whether to trust a site's certificate -- that is yours to decide. The flow
# stops and says so.
#
# It does not retry forever: three attempts, then it stops and asks for a
# person. Hammering a server that is refusing a login looks like an attack on
# it, whatever it was meant to be.
#
# It does not click through another window. Before each click the window is
# brought to the front, and if something else is still over the place to
# click -- a browser, a chat, GoBot itself -- it waits for it to go, and after
# half a minute gives the attempt up. A minimised VTCZone is brought back.

[Login]
# The publisher's launcher. Yours is wherever you installed VTCZone.
launcher=C:\Program Files\VTCZone\VTCZone.exe
launcher_window=VTCZone

# The client's own small launcher -- the window with the purple start button.
#
# It has NO TITLE. It is a bare Win32 dialog of class #32770 put up by
# GhostOnlineVTC.exe, so it has to be found by class and program; asking for
# it by name finds nothing, and the flow then waits out the whole minute while
# the window sits on the screen in front of you. Leave client_window empty.
client_window=
client_class=#32770
client_process=GhostOnlineVTC.exe

# Then the game itself. This one does have a title. Leave the class and the
# process blank unless the title alone starts picking the wrong window.
game_window=GhostOnlineVTC
game_class=
game_process=

# VTCZone signed out shows its sign-in form, whose blue "DANG NHAP" button is
# this picture. Seen while the flow waits for one of VTCZone's own pages, with
# none of them up, and still there five seconds later, it stops the flow --
# with no retry, since the form will still be there. A VTCZone that GoBot has
# just started gets half a minute first, in case it shows the form while it
# signs itself in. Leave signin_picture empty to turn the check off; the flow
# then waits the page out and gives up. signin_score is between 0.5 and 1,
# written with a point; anything else is ignored and 0.80 used.
signin_picture=login_page
signin_score=0.80

# Which channel, which character, and which game in the account's list.
# All three count from ZERO: channel_index=0 is Kênh 1, =4 is Kênh 5.
#
# Where each entry sits on screen is measured once and written down under
# [Page.channel_list] and [Page.character] at the bottom of this file. These
# are just the index into it.
channel_index=0
character_index=0
game_slot=0

# How many times to try the whole crossing before giving up and asking for a
# person.
attempts=3

# Press the healing keys the moment the character appears.
#
# Worth doing. A character logging back in after a disconnect arrives exactly
# where it died, which is where the thing that killed it still is -- and the
# macro does not start until the flow has finished closing popups. Set these
# to the same Win32 key codes as the potion keys in macro.ini; 0 for neither.
heal_on_arrival=true
heal_hp_key=0
heal_mp_key=0

# ---------------------------------------------------------------------------
# THE PAGES
# ---------------------------------------------------------------------------
# picture    which picture marks this page. Blank means not identified yet.
# click_dx   where to click, measured from the picture's top-left corner.
# click_dy   -1 for both means the middle of the picture.
# wait_s     how long to wait for the page before giving up, 1 to 600 seconds.
# score      how well the picture has to match, 0.5 to 1 (with a point, not a
#            comma; anything else is ignored and 0.70 used). A page that is
#            mostly a photograph the publisher changes may need this lowered.
# row_step   for the two pages that are a list: how far apart the entries are.
#            The index comes from game_slot / channel_index above.

# The account's list of games. Point click_dx/click_dy at the first entry and
# set row_step to the distance to the second.
[Page.game_list]
picture=app_select_page
click_dx=-1
click_dy=-1
wait_s=60
score=0.70
row_step=0

# The red "Choi game" button on the publisher's launcher.
#
# Confirmed against a live launcher: this picture matched at 402,547, 180x50,
# at a score of 1.000, and the capture shows the red button saying "Choi game".
# The helper's own log records it clicking START_GAME_PAGE at 402,546 -- the
# same button, one pixel apart.
[Page.start_game]
picture=start_game_page
click_dx=-1
click_dy=-1
wait_s=60
score=0.70
row_step=0

# The purple START button on the game's own launcher.
#
# A second launcher, and a second button: pressing "Choi game" above does not
# start the game, it starts GhostOnlineVTC.exe, which puts up its own small
# untitled window -- a progress bar, a readiness line, and START.
#
# Measured against that live window, client area 743x551:
#
#   start_game_button   583,472  134x49  score 1.000  <- the purple button
#   start_game_button2  341,478  223x19  score 1.000  <- "Updates are completed."
#
# This used to name start_game_button2, which is the readiness TEXT and not
# the button. Clicking the middle of it clicked the words, 240 pixels to the
# left of anything that does anything -- the second half of "it does not press
# the purple button", after the window itself could not be found.
#
# Naming the button also gates on readiness for free: while the launcher is
# still updating the button is not drawn like this, so it does not match, and
# the flow waits instead of pressing a dead control.
[Page.client_start]
picture=start_game_button
click_dx=-1
click_dy=-1
wait_s=90
score=0.70
row_step=0

# "Kết Nối", once the game is up.
[Page.connect]
picture=game_ready_indicator
click_dx=-1
click_dy=-1
wait_s=90
score=0.70
row_step=0

# The channel list -- "Chọn Kênh".
#
# Despite its name, channel_first_index is the TITLE BANNER of this screen,
# not the first channel. Measured on a live client it matched at 426,126,
# 190x62, which is the ornate "Chọn Kênh" plate; the channel rows start 140
# pixels below it. Clicking the middle of the picture therefore clicked the
# title, which does nothing -- and the crossing still worked, because the
# connect that follows joins whichever channel is already selected. Which is
# always Kênh 1. That is why this needed real geometry before a channel could
# be chosen at all.
#
# Measured by parking the client on the screen:
#
#   gobot_cli --login --upto channel_list
#
# The eight rows sit at client y 266, 298, 328, 360, 390, 422, 452, 483 --
# 217 pixels across seven gaps, so the pitch is exactly 31. Row 1 is 140
# below the banner's top edge, and 54 to the right of its left edge puts the
# click on the "Kênh N" label rather than on the status icon at the far right.
#
# Which channel to join is channel_index in [Login] above, counting from zero:
# 0 is Kênh 1 and 7 is Kênh 8.
#
# row_count is 8 -- confirmed, both measured and by the person whose server
# this is. Asking for a ninth is refused and the eighth is used instead,
# rather than clicking 31 pixels below the last row onto whatever is there.
[Page.channel_list]
picture=channel_first_index
click_dx=54
click_dy=140
wait_s=60
score=0.70
pick=row
row_step=31
row_across=false
row_count=8

# "Kết Nối" a second time.
#
# Picking a channel closes the list and puts the same connect button back up.
# Without this press the character screen never comes: a live run waited out
# the full minute on 'character', gave up, and started the whole crossing
# again -- and the second attempt worked, because restarting is what supplied
# the press that was missing. Same picture as [Page.connect], because it is
# the same button.
[Page.connect_again]
picture=game_ready_indicator
click_dx=-1
click_dy=-1
wait_s=60
score=0.70
row_step=0

# The character to play -- "Chọn Nhân Vật".
#
# Your characters stand side by side on the stage. Picking one is two clicks,
# the way a person does it: click the character, then click "Bắt Đầu Game".
# That is pick=slot, and character_index in [Login] is which one, counting
# from zero -- 0 is the leftmost, 1 the next, and so on.
#
# Measured on a live client, 1024x768, with select_char_indicator found at
# 842,655 169x99 -- which covers BOTH buttons in the bottom right:
#
#   slot 1          figure spanning x 310..339, centre 324
#   slot 2                          x 508..539, centre 524
#   slot 3                                      centre 729
#   "Bắt Đầu Game"  x 854..992, text centred at 923,680   <- start
#   "Quay Lại"      same x,     text centred at 923,733   <- back
#
# The figures were measured by their dark outlines across y 500..518, which is
# their legs: higher up the banner behind each one runs into the next.
# 324, 524 and 729 are 200 and 205 apart, so row_step is 202 and slot 3 lands
# within three pixels of centre -- against sprites some thirty wide.
#
# row_dx/row_dy are slot 1 from the picture's corner (324-842, 495-655), and
# they are negative because the stage is a long way left of the start button
# that the picture marks. click_dx/click_dy are that button (923-842, 680-655).
#
# Those used to be -1/-1, the middle of the picture, which is 926,704 -- in the
# gap between the two buttons and 29 pixels from "Quay Lại". It worked, but it
# was aimed at nothing, and the thing it nearly hit leaves the game.
#
# step_pause_ms is the wait between picking and confirming. Do not set it to
# zero: confirming in the same instant as the choice starts the previous
# character.
#
# NOT VERIFIED: the account this was measured on has one character standing in
# slot 2 and a shadow in slot 3, so a click was never seen to move the choice
# from one character to another. The geometry is measured and the two clicks
# are right; which slot holds which character is yours to check. Park the
# client on the screen with
#
#   gobot_cli --login --upto character
#
# and count from the left. row_count is 3 because the stage holds three; if
# yours shows more, raise it.
[Page.character]
picture=select_char_indicator
click_dx=81
click_dy=25
wait_s=60
score=0.70
pick=slot
row_dx=-518
row_dy=-160
row_step=202
row_across=true
row_count=3
step_pause_ms=1200
