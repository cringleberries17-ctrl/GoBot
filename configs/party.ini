# GoBot party settings
#
# The same keys the commercial client uses, so a configuration can be carried
# between them without translation -- these are its own, taken from its
# party_s0_default.ini.
#
# Whether a party is there, who leads it, and where the sharing dropdowns sit
# is not worked out here. That comes from the other helper's own detector,
# called through the bridge: its PartyStatusDetector takes the game's window
# and answers, and its PartyConfigureDetector computes where to click for a
# given client width. Those numbers used to be measured by hand and got wrong.
#
# Check what it reports right now with:  gobot_cli --party
#
# Lists take commas or one name per line.

[Party]
party_auto_accept=true
party_auto_party=true
party_always_leader=false
use_blacklist=false
party_by_magic_word=true
party_magic_word=pt
party_whitelist=
party_blacklist=
party_by_list=false
party_accept_only=
party_exp_share_type=0
party_drop_share_type=0
party_priority_list=
party_use_priority_list=false

# ---------------------------------------------------------------------------
# INVITING FROM CHAT
# ---------------------------------------------------------------------------
# A player types the keyword, the bot invites them. The deciding half is built
# and tested; these are the numbers the acting half needs.
#
# The shape is the other helper's, read out of the configuration record its own
# code is constructed with: six lines of chat, three reads a short way apart
# with the majority winning, a name match that need only be seven tenths right,
# and a cooldown before the same player is invited again. Reading the chat
# three times is the part worth keeping -- a misread rarely repeats the same
# way twice, while a real line reads the same every time.

[Chat]
keyword          = pt
votes            = 3
vote_gap_ms      = 150
min_name_match   = 0.7
cooldown_s       = 30
whole_word_only  = true

# ---------------------------------------------------------------------------
# THE PLAYER LIST
# ---------------------------------------------------------------------------
# Inviting means: open the list of players on the map, find the line with the
# name that asked, click it, then press invite.
#
# The other helper names every one of these and ships them all as zero -- they
# live in its settings database, not its code. So they were measured instead,
# off a real capture taken by  gobot_cli --playerlist  on a 1024x768 client.
# Re-run that if your client is a different size; it opens the list, saves the
# picture, and reads what it can.
#
# MEASURED, NOT GUESSED -- but measured against an EMPTY list, because nobody
# else was on the map. The panel and the row pitch are solid. Which column
# holds the name, and where the invite button appears, are not: both need a
# list with somebody in it. They are left at zero rather than filled in with a
# guess, and the invite will refuse to run until they are set.

[PlayerList]
# The button that opens it. Cut out of the helper's assembly and kept beside
# this executable, so the whole set comes from one place: the other two
# pictures this feature needs were cut from live captures and could never have
# been in that DLL.
open_button_picture = grabbed/player_in_map_icon

# How the list is told apart from the panel that shares its place on screen.
#
# The client draws its activity notices in the same rectangle, so 'is there
# text in the panel' answers the wrong question -- the first live run read five
# notices as five players with unpronounceable names. Reading the level column
# instead does not work either: the list is yellow on near-black and the bitmap
# reader turns '162' into 'fC2'.
#
# So it is recognised by the one thing the notices panel has not got: the empty
# rows with the two column separators ruled through them. That picture carries
# no text, so it looks the same whoever is on the map.
grid_picture = grabbed/player_list_grid
grid_score   = 0.90

# The three columns, for reading a row.
level_x     = 748
level_width = 45
name_x      = 795
name_width  = 135

# How alike a row must be to the name being looked for. Low on purpose: this
# list reads worse than the invitation dialog does -- the same player came back
# as 'Mag cTo h n', seven of ten letters in the right order.
min_name_match = 0.6

# The panel, in client coordinates.
roi_x       = 744
roi_y       = 160
roi_width   = 276
roi_height  = 214

# The first row's top edge, and the distance to the next.
first_row_y = 172
row_height  = 20
rows        = 10

# Where along a row to click to select it.
#
# Measured against a list with somebody in it: the three columns are level,
# name and class, split at x = 751 / 795 / 930 / 997, so the name column runs
# 795..930 and its middle is 862. The row read was "174 | MunxMun | Cung Thu".
click_x     = 862

# How far below the selected row the invite button appears.
#
# Clicking a name does not invite: it pops a small menu of three buttons over
# the list -- whisper, request party, offer trade -- and the middle one is the
# invite. So the sequence is click the name, then click this.
#
# Measured by selecting a real row and finding the light button blocks against
# the dark panel. They came out at y 188-204, 212-229 and 236-253 for a row
# clicked at y=182, and the Req Party button spans x 833..889. Its middle is
# therefore 38 below the row and one pixel left of where the row was clicked,
# which is near enough to the same x.
invite_button_dx = 0
invite_button_dy = 38

# What the middle button says, for checking the menu is the one expected
# before anything is clicked. The other two are a private message and a trade
# offer, and clicking either of those by mistake is not a quiet failure.
invite_button_text = Req Party
# ---------------------------------------------------------------------------
# ACCEPTING AN INVITATION
# ---------------------------------------------------------------------------
# Somebody asks you to join their party and the client puts up a small modal
# at the bottom of the screen:
#
#     +---------------------------------------+
#     |        Yeu cau cua ExampleWin.        |
#     |                [Xac Nhan] [Huy Bo]    |
#     +---------------------------------------+
#
# It is up for about TEN SECONDS and then it is gone, which is why an
# unattended bot misses every one, and why this had to be caught on a capture
# loop rather than photographed at leisure.
#
# MEASURED off three live invitations, all at the same place on a 1024x768
# client: the box spans x 413..613, y 690..767, the confirm button is centred
# at 536,751 and the cancel button at 578,751.
#
# The dialog is found by its FOOTER -- the two buttons and the border beside
# them -- rather than by the whole box, because the box contains the inviter's
# name and a picture of the whole thing would only ever match the one player
# it was taken from. The offsets below are from the footer's top-left corner.

[Invite]
# The footer picture, cut out of a captured invitation.
picture = grabbed/party_invite_buttons
score   = 0.80

# The two buttons, from the picture's corner. accept is "Xac Nhan".
accept_dx  = 31
accept_dy  = 23
decline_dx = 73
decline_dy = 23

# The line of text, from the same corner. Negative because it is up and to the
# left of the footer. The name is read out of it with the game's own bitmap
# font and checked against the lists above BEFORE anything is clicked -- the
# same modal shape carries other requests, and a bot that presses confirm on
# whatever appears will eventually confirm something else.
name_dx = -82
name_dy = -26
name_w  = 182
name_h  = 30

# What comes before the name. Everything after it, up to the full stop, is the
# player. A line without this is not an invitation and is left alone.
#
# Compared with the accents stripped and the case ignored, so "cua" here
# matches "cua" on screen. That is not tidiness: this file has to be editable
# by somebody who cannot type u-hook, and the bitmap reader gets a mark wrong
# far more often than it gets the letter wrong.
prefix = cua

# The pause before clicking, so the dialog has settled.
settle_ms = 400

# ---------------------------------------------------------------------------
# These belong to the sections named, not to [Invite] above. Repeating a
# section header is how a config file adds to one that is already open --
# appended without one, these keys landed in whatever section happened to be
# last, and were silently never read.
# ---------------------------------------------------------------------------

[PlayerList]
# The list hangs off the button that opens it, and that button keeps to the
# right edge of the client (956,139 at 1024x768, 1212,139 at 1280x720). So the
# panel, the columns, first_row_y and click_x above -- measured on a 1024x768
# client -- are moved with the button wherever it is found, and a row or Req
# Party outside the list is never clicked. Add  place = fixed  here to use them
# exactly as written instead.
#
# How long to wait after picking a row for the three-button menu to be drawn.
#
# 700ms was not enough: the first live run clicked where Req Party was going to
# be, the menu appeared afterwards, and the run reported success with the menu
# untouched on screen.
menu_wait_ms = 1800

[Chat]
# Where the chat lines are read. GoBot finds the closed chat bar --
# inven/0/dialog_chat_res3.spr/1, 22 rows above the bottom on every client --
# and reads the two lines just above it, so they are found at 1280x720 as at
# 1024x768. The numbers below were measured on a 1024x768 client (readable
# lines at y 710 and 723, a pitch of 13, x 6 to 396) and are used only with
# place = fixed  added here.
#
# chat_y is the TOP OF THE TEXT and must not be set above it. Three pixels too
# high and the reading window clips the descenders: every g and p comes back as
# o, so "ExampleWin pt" reads as "MaoicToy in ot" and the keyword never
# matches. The name survives that -- it is matched loosely -- but a two-letter
# keyword has nothing to spare.
chat_x      = 6
chat_y      = 710
chat_width  = 390
line_height = 13
lines       = 3