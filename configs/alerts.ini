# Thông báo: khi có chuyện cần người — nhân vật chết, mất kết nối, bot tự dừng —
# GoBot gửi một tin ngắn bằng tiếng Việt vào kênh Discord của bạn (qua webhook),
# và kêu một tiếng, hiện thông báo của Windows trên máy này.
#
# Thẻ "Thông báo" trên màn hình đơn giản ghi file này mỗi khi bạn đổi gì; sửa
# bằng tay cũng được (UTF-8). Không có file này thì thông báo tắt.
#
# Đường dẫn webhook KHÔNG nằm ở đây: dán nó ở thẻ Thông báo. GoBot mã hoá nó
# bằng Windows (DPAPI) và cất ở %LOCALAPPDATA%\GoBot\alerts_webhook.bin, ngoài
# thư mục GoBot, nên chép thư mục GoBot đi đâu cũng không mang nó theo, và chỉ
# tài khoản Windows này trên máy này đọc được. Dòng webhook= viết vào file này
# sẽ bị bỏ qua. Muốn xoá webhook: bấm "Xoá webhook" ở thẻ Thông báo (hoặc xoá
# file alerts_webhook.bin kia).
#
# Tin gửi đi chỉ gồm câu có sẵn và con số (số lần, số phút, mã lỗi của game).
# GoBot không bao giờ gửi tên tài khoản, mật khẩu, tên nhân vật, bản đồ, vị trí,
# ảnh màn hình hay lời người chơi khác. Tên người chơi khác chỉ đi kèm tin tổ
# đội khi bật party_names.

[Alerts]
# Bật thông báo. Tắt thì không gửi gì, không kêu gì.
enabled=false
# Gửi vào Discord (cần đã dán webhook ở thẻ Thông báo).
discord=true
# Kêu tiếng cảnh báo của Windows trên máy này, nhiều nhất 10 giây một lần.
sound=true
# Hiện thông báo của Windows ở góc màn hình. Không cướp chuột hay bàn phím
# khỏi game.
toast=true
# Tên máy hiện ở đầu mỗi tin, ví dụ: Máy 1 (tối đa 32 ký tự; @ và ` bị bỏ).
# GoBot không tự điền tên nhân vật vào đây.
label=
# Cùng một thông báo lặp lại trong chừng này giây thì gộp thành một tin (×N),
# gửi khi hết khoảng đó (10-600).
merge_s=60
# Nhiều nhất bao nhiêu tin mỗi phút (1-10) và mỗi giờ (1-120). Tin vượt quá thì
# chờ, gộp lại, tin cần người đi trước; tin cần người không phải chờ giới hạn
# mỗi giờ, chỉ chờ giới hạn mỗi phút.
max_per_minute=5
max_per_hour=30
# Báo "không thấy nhân vật trong game" khi bot đang chạy mà không thấy thanh
# HP/MP chừng này phút liền (1-30).
not_in_world_min=3

[Events]
# Báo khi nào: true là báo, false là không.
# Nhân vật chết.
death=true
# Đã hồi sinh tại chỗ.
revived=true
# Hồi sinh 3 lần không được (có thể hết giấy hồi sinh/bùa hồi sinh). Cần người.
revive_failed=true
# Mất kết nối: game tắt, treo hoặc hiện bảng lỗi.
disconnect=true
# Đã tự vào lại game.
back_in=true
# Không tự vào lại game được nữa. Cần người.
keeper_gave_up=true
# Không thấy nhân vật trong game quá not_in_world_min phút, và khi thấy lại.
not_in_world=true
# Hộp thoại thùng rác có thể vẫn mở. Cần người.
trash_stuck=true
# Ô chat trong game có thể vẫn mở. Cần người.
chat_stuck=true
# Tự chat tự dừng vì nhiều lần liền không gửi được.
chat_stopped=true
# Làm nhiệm vụ nhanh tự tắt. Cần người.
quest_trouble=true
# Ô phím của bình HP hoặc MP còn ít hơn số đặt ở thẻ Đánh quái (là chồng bình
# đang dùng; trong túi có thể còn chồng khác).
potion_low=true
# Ô phím của bình đã trống mà GoBot vẫn bấm phím đó. Cần người.
potion_out=true
# Vào tổ đội hoặc mời người vào tổ đội.
party_change=false
# Kèm tên người chơi khác trong tin tổ đội.
party_names=false
