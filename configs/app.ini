# GoBot application configuration

[Capture]
# Capture interface. Leave blank to auto-detect via the default route.
# Run `gobot_sniff --list` to see the exact names.
interface=

# Game server address.
#
# LEAVING THESE BLANK IS NOT NEUTRAL. With no filter the capture takes every
# TCP stream on the adapter — browser, Windows Update, everything — and feeds
# all of it through the game's framing. None of it tiles, so each foreign byte
# counts as a resync: --status reported 40,966 resyncs against 467 frames,
# which looks exactly like a broken FramingSpec and is nothing of the kind.
# Filling these in took it to 0 under otherwise identical conditions.
#
# `gobot_sniff --discover --process Game.exe` prints the right values. The game
# holds two sockets and only one carries play; the other sent nothing in twenty
# seconds and is the idle auth connection. Capture the busy one.
server_ip_start=103.82.30.42
server_ip_end=103.82.30.42
port_start=15101
port_end=15101

# Raw BPF filter. Overrides the fields above when set.
# e.g. tcp and host 203.0.113.10 and port 15000
bpf_filter=

# How often decoded frames are handed to the protocol layer, in ms.
batch_interval_ms=50

# Run packet-capture setup on launch. Off: the keyboard macro needs none of it,
# and capture requires Administrator plus a working protocol map. Turn it on if
# you want the packet-driven bot as well as the macro.
autostart=false

[Window]
# Which window receives synthetic input.
#
# Class and process are the reliable identifiers; title alone is not. A title
# on its own counts only when it is the window's whole title, and a folder,
# editor or browser tab named after the game can have exactly that title --
# the bot would then type combat keys into it. When class or process is set here, the GUI auto-selects on startup; with only
# a title it waits for you to pick from the list on the Capture tab.
#
# Values below are the GhostOnline VTC client. Confirm them against the window
# list in the GUI if your build differs.
title=GhostOnlineVTC
class=GhostSoul
process=Game.exe

[Session]
# Running without somebody sitting there.
#
# The bot cannot tell on its own that it is pressing keys at nothing. The
# client disconnects, or exits, or sits at the channel list, and the macro
# carries on regardless — eight hours of that is what you come back to.
#
# What settles it is the HUD. A character in the world has a health bar and a
# mana bar drawn as a matched pair at the top of the window, and nothing else
# the client shows looks like that: not the launcher, not the character
# select, not a disconnect dialog, not a loading screen. So "are both bars
# there?" is the whole question, and a dialog nobody has ever seen before
# still answers it correctly.

# How often to look, in milliseconds.
poll_ms=2000

# How long the HUD may be missing before the session counts as lost.
#
# Generous on purpose. Changing map, dying, reviving and opening a full-screen
# dialog all hide the HUD for a few seconds while nothing is wrong at all.
lost_grace_s=25

# Stop the run after this many minutes. 0 means never.
stop_after_minutes=0

# Turn the machine off once the run has stopped.
#
# Off unless you write it down here. The countdown is announced and can be
# called off from any console with `shutdown /a` — which is the only reason
# this is allowed to exist.
shutdown_when_done=false
shutdown_delay_s=60

[Crash]
# Noticing that the client has fallen over, as opposed to merely being between
# screens. Used by `gobot_cli --crashcheck` and `--keepalive <minutes>`.
#
# [Session] above asks "is the HUD there?", which is the right question for an
# interrupted session and the wrong one for a dead client: a crash, a loading
# screen and a death all look identical to it. This asks the other question,
# and there are three answers.
#
#   the process is gone       watched live -- left alone at the character
#                             select this client closes itself after about two
#                             minutes, with no dialog and nothing in its log
#   it has stopped answering  Windows knows; nothing else does, because a
#                             frozen client keeps drawing its last frame
#   a message box is up       the one that carries the error code
#
# The code is READ out of the dialog rather than matched against a picture of
# it, so a code nobody has seen before still comes out right. There are a lot
# of them and nobody has a picture of each.

# The game, the launcher that starts it, and Windows' own crash reporter --
# which puts up "Game.exe has stopped working" on behalf of a program that can
# no longer speak for itself. All three are ended before logging back in:
# leaving the launcher behind means the next crossing finds a window it did
# not put there, and a reporter left running holds the executable open.
#
# Only the game's own of each, never one that merely has its name: the game
# and the launcher running from the game's folder, and the crash reporter
# only while it is reporting on the game. Any other program of these names --
# another game's Game.exe, the box Windows puts up when some other program
# crashes -- is left alone, and the log says so.
game_process=Game.exe
launcher_process=GhostOnlineVTC.exe
reporter_process=WerFault.exe

# How long a window may stay unresponsive before it counts as hung.
#
# Not instant, because it should not be. A client loading a map, or one on a
# machine that is swapping, stops pumping messages for a few seconds at a time
# while nothing is wrong, and restarting the game every time that happens is
# worse than the problem it fixes.
hung_grace_s=20

# Give up after this many restarts, then ask for a person.
#
# A restart is every time the game had to be closed and entered again: a
# client found gone, hung, showing an error box or stalled (below), and a
# client a crossing ends because it stuck part way in -- whether that
# crossing began after one of those or from the "Vào game ngay" key. Counted
# from each start of the keeper (BẮT ĐẦU, or ticking "Tự vào lại game").
#
# A client that crashes once is a crash. A client that crashes five times is
# something restarting will not fix — a bad patch, a full disk, a
# locked account — and a loop that keeps reconnecting to a server which is
# refusing it is indistinguishable from an attack on that server.
max_restarts=5

# Wait this long after ending the client before starting again, so the server
# sees the session close rather than two of them at once.
cooldown_s=15

# The watchdog: also end the client and log back in when it runs and answers
# but nobody has been in the world for stall_min minutes -- a disconnect drawn
# inside the game rather than in a Windows box, or a client left at the
# channel list or the character select. Counted against max_restarts like a
# crash. Never for a dead character, for a screen that cannot be seen (the
# game minimised, or behind or under another window when it is read off the
# screen, or a window GoBot follows that is not the game's own by where its
# program runs from), nor while GoBot itself has the game in hand. Only while
# "Tự vào lại game" runs; ticked under it on the Tự đăng nhập tab. Off as
# shipped.
# Cũng vào lại khi game vẫn chạy mà không thấy nhân vật quá stall_min phút.
stall_enabled=false
# Minutes with nobody in the world, 1 to 30.
stall_min=5
# A screen that keeps changing and is none of the login pages -- a map
# loading -- is given this long instead, in minutes. A login page is not.
stall_loading_max_min=15

[Simple]
# The simple screen's own switches. Ticked there; written here.

# Watch the client and log back in when it crashes, hangs or reports a lost
# connection, using configs/login.ini. Runs while the bot runs.
keep_alive=false

# Revive on the spot when the character dies, with a revive item: the death
# panel's "Sử dụng vật phẩm hồi sinh", then Xác Nhận. Never the village,
# never Cash. Three tries for each death; when they fail -- most likely no
# revive item left -- the whole bot stops and says why.
revive=false

# While the bot runs -- anything DỪNG LẠI stops, or the packet bot -- bring
# the game back to the front at once whenever something else has taken the
# focus -- GoBot's own window too -- a moment (0.2 s) after the last click or
# key, so a click lands first, and up to 10 s while a key box waits for its
# key (less when HP falls under the HP potion's mark, or 50% if that is
# higher). The keys only land while the
# game is in front. Anything typed into another window after that goes to
# the game: set false to use the PC while the bot runs.
refocus=true

# During a run, close the few popups that get in the way, each with its own
# control, once it has stayed up for 3 seconds: the check-in reward's notice
# (its Xác Nhận), Yêu Quái Bách Khoa (its X, or ESC when nothing else is up),
# and the ESC menu when GoBot's own ESC brought it up. Nothing else, ever: not
# the trash bin's dialogs, a party invitation, the revive panel, the quest
# window or a window it does not know -- and nothing at all while any of those
# is up. Ticked on the Đánh quái tab ("Tự đóng thông báo"). Off as shipped.
# Tự đóng thông báo: chỉ đóng thông báo nhận quà điểm danh, Yêu Quái Bách Khoa
# và menu ESC do GoBot mở.
close_popups=false

# Light mode, for a VMware guest or a weak PC: GoBot's window is drawn less
# often -- 20, 3 and 1 frames a second instead of 30, 5 and 2 (while it is
# used, while it is in front and nobody touches it, while another window is)
# -- a way of taking the game's picture that the game has refused is not
# tried again, and while anything runs HP and MP are read every 250 ms
# instead of 150 (vitals_run_ms in [Performance]). The bot fights, drinks
# potions and hears its keys as always.
# auto: on when GoBot sees a VMware guest or a PC with no real graphics card
# (the "Machine:" line at the top of gobot_gui.log says what it saw); on or
# off: as set. Ticked on the simple screen ("Nhẹ máy (máy ảo / máy yếu)"),
# which writes on or off.
# Nhẹ máy: auto = GoBot tự bật khi thấy máy ảo VMware hoặc máy không có card
# đồ hoạ thật; on = luôn bật; off = luôn tắt. Khi bật, lúc bot chạy GoBot đọc
# HP/MP mỗi 250 ms thay vì 150 ms.
light_mode=auto

[Potions]
# How many potions are left on each potion key's hotbar slot -- the stack in
# use, not everything in the bag -- read every read_every_s seconds of a run
# and shown under the potion rows on the Đánh quái tab. Look only: nothing is
# pressed or clicked for it.
# Số bình còn lại trên ô phím của bình HP/MP (chồng bình đang dùng), đọc khi
# bot chạy. Chỉ nhìn, không bấm gì.

# Warn once when a slot shows fewer than this, 0 to 500; 0 never warns of a
# slot running low (the bag's warning is warn_bag_below's, below). A slot
# gone empty is said whatever this is. Set on the Đánh quái tab ("Báo khi
# còn dưới").
# Báo khi ô phím còn dưới chừng này bình (0 = không báo sắp hết theo ô phím).
warn_below=20
# Warn once when the whole bag holds fewer than this of what a potion key
# drinks, 0 to 9999; 0 never warns by the bag. Only for a key whose slot the
# packets' bag has been checked against ([Packets] bag); the slot's own
# warn_below is then not said. Its own number: 20 in the bag is about a minute
# of hunting at 19 potions a minute, 200 about ten.
# Báo khi cả túi còn dưới chừng này bình của phím đó (theo gói tin; 0 = không
# báo). 200 bình là khoảng 10 phút đánh quái nếu uống 19 bình mỗi phút.
warn_bag_below=200
# Seconds between reads, 2 to 300.
# Bao nhiêu giây đọc một lần.
read_every_s=10

[Hotkeys]
# Two keys that each do one job at once, acted on only while the game's window
# is in front: one trash pass now, as the Dọn rác tab's "Dọn ngay", and one
# login crossing now, when nobody is in the world -- pressed again during it,
# that crossing stops. Key codes; 0 is no key, and both ship with none. Set on
# the Dọn rác and Tự đăng nhập tabs. F10 and F11 act with the game or GoBot in
# front, F12 from anywhere.
# Phím dọn túi ngay và phím vào game ngay: chỉ có tác dụng khi cửa sổ game ở
# trên cùng. 0 là không dùng phím nào.
trash_now=0
login_now=0

[Performance]
# How hard GoBot works the PC it runs on. Each value here is the shipped one.
# Độ nặng của GoBot lên máy. Thường không cần sửa.

# Draw GoBot's window only when there is something to show: at once on a
# click or a key, then 30 frames a second while it is used, 5 while it is in
# front and nobody touches it, 2 while another window -- the game -- is in
# front (light mode in [Simple]: 20, 3 and 1). F10, F11, F12 and the potions
# are looked after just as often either way. off: a frame on every pass, as
# often as the screen refreshes, as GoBot drew before 2026.11.02b.
# on = chỉ vẽ lại cửa sổ GoBot khi cần, nhẹ máy hơn; off = vẽ liên tục như bản cũ.
gui_pacer=on

# How often HP and MP are read while nothing runs, in milliseconds, 150 to
# 5000; 150 reads as often as GoBot did before 2026.11.02b. While anything
# runs -- the bot, a job, a one-off pass such as Dọn ngay or Gửi thử, or "Tự
# tìm" -- they are read as vitals_run_ms below says, but never less often
# than this.
# Bao nhiêu mili giây đọc HP/MP một lần khi bot không chạy. Khi bot chạy thì
# theo vitals_run_ms ở dưới, nhưng không chậm hơn số này.
vitals_idle_ms=1000

# How often HP and MP are read while anything runs, in milliseconds. 0, as
# shipped, chooses: every 150 ms, as GoBot always has, or every 250 ms in
# light mode ([Simple] light_mode). Any other number is used instead, light
# mode or not, held to 100 to 1000. Either way it is never slower than
# vitals_idle_ms above: with vitals_idle_ms=150, HP and MP are read every
# 150 ms while anything runs, light mode or not. The potions go by the last
# reading, so a larger number lets HP fall a little further before a potion
# is pressed.
# Bao nhiêu mili giây đọc HP/MP một lần khi bot chạy. 0 = GoBot tự chọn: 150
# ms, hoặc 250 ms khi bật Nhẹ máy. Số khác: dùng số đó (100 tới 1000). Dù thế
# nào cũng không chậm hơn vitals_idle_ms ở trên.
vitals_run_ms=0

# A "Load:" line in gobot_gui.log this often, in seconds, 10 to 3600: what
# GoBot's threads, frames and screen grabs cost the PC. 0: no such line.
# Bao nhiêu giây ghi một dòng "Load:" (GoBot nặng máy cỡ nào) vào
# gobot_gui.log; 0 = không ghi.
load_log_s=60

[Packets]
# What GoBot may take from the game's own packets instead of the screen, once
# it has checked them against the screen while you play. auto: each is used
# as soon as its check passes, and the screen takes over again at once when
# they disagree. off: the screen as before. Either way each check writes what
# it found to gobot_gui.log. With packet_positions=off in hunt.ini nothing is
# taken from the packets at all.
# GoBot lấy thông tin từ gói tin của game thay cho màn hình, sau khi đã tự so
# với màn hình lúc bạn chơi. auto = dùng khi đã so khớp; off = đọc màn hình
# như cũ.

# Your HP and MP, for the potions and for when the jobs may start.
# HP/MP của nhân vật (cho bình máu, bình mana).
vitals=auto

# How many potions the bag holds, for "Low" and for the shop; and a charm's
# slot checked before it is right-clicked.
# Số bình trong túi (báo sắp hết bình, mua bình); và ô bùa, xem trước khi
# dùng để không dùng nhầm bùa.
bag=auto

# Read the monsters' name plates less often while the packets steer the
# hunt, which spares the PC.
# Đọc tên quái trên màn hình thưa hơn khi đang đánh theo gói tin (nhẹ máy).
detector_rest=auto

[Paths]
protocol=configs/protocol.ini
bot_config=configs/bot_default.ini
log=gobot.log
log_level=info

# gobot_gui.log, beside gobot_gui.exe, starts afresh each time GoBot is
# opened: the time before is kept as gobot_gui.old.log, and older ones go.
# A log sent with a problem then holds those two sessions, not weeks of
# character names, chat lines and folder paths. false: every session is added
# to the one file, which only grows. gobot_cli's log= above always adds.
new_log_each_start=true
