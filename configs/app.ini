# GoBot application configuration

[Capture]
# Capture interface. Leave blank to auto-detect via the default route.
# Run `gobot_sniff --list` to see the exact names.
interface=

# Game server address.
#
# LEAVING THESE BLANK IS NOT NEUTRAL. With no filter the capture takes every
# TCP stream on the adapter — browser, Windows Update, everything — and feeds
# all of it through the game's framing. None of it tiles, so each foreign byte
# counts as a resync: --status reported 40,966 resyncs against 467 frames,
# which looks exactly like a broken FramingSpec and is nothing of the kind.
# Filling these in took it to 0 under otherwise identical conditions.
#
# `gobot_sniff --discover --process Game.exe` prints the right values. The game
# holds two sockets and only one carries play; the other sent nothing in twenty
# seconds and is the idle auth connection. Capture the busy one.
server_ip_start=103.82.30.42
server_ip_end=103.82.30.42
port_start=15101
port_end=15101

# Raw BPF filter. Overrides the fields above when set.
# e.g. tcp and host 203.0.113.10 and port 15000
bpf_filter=

# How often decoded frames are handed to the protocol layer, in ms.
batch_interval_ms=50

# Run packet-capture setup on launch. Off: the keyboard macro needs none of it,
# and capture requires Administrator plus a working protocol map. Turn it on if
# you want the packet-driven bot as well as the macro.
autostart=false

[Window]
# Which window receives synthetic input.
#
# Class and process are the reliable identifiers; title alone is not. A title
# substring match will happily select an editor or browser tab that happens to
# be named after the game, and the bot would then type combat keys into it.
# When class or process is set here, the GUI auto-selects on startup; with only
# a title it waits for you to pick from the list on the Capture tab.
#
# Values below are the GhostOnline VTC client. Confirm them against the window
# list in the GUI if your build differs.
title=GhostOnlineVTC
class=GhostSoul
process=Game.exe

[Session]
# Running without somebody sitting there.
#
# The bot cannot tell on its own that it is pressing keys at nothing. The
# client disconnects, or exits, or sits at the channel list, and the macro
# carries on regardless — eight hours of that is what you come back to.
#
# What settles it is the HUD. A character in the world has a health bar and a
# mana bar drawn as a matched pair at the top of the window, and nothing else
# the client shows looks like that: not the launcher, not the character
# select, not a disconnect dialog, not a loading screen. So "are both bars
# there?" is the whole question, and a dialog nobody has ever seen before
# still answers it correctly.

# How often to look, in milliseconds.
poll_ms=2000

# How long the HUD may be missing before the session counts as lost.
#
# Generous on purpose. Changing map, dying, reviving and opening a full-screen
# dialog all hide the HUD for a few seconds while nothing is wrong at all.
lost_grace_s=25

# Stop the run after this many minutes. 0 means never.
stop_after_minutes=0

# Turn the machine off once the run has stopped.
#
# Off unless you write it down here. The countdown is announced and can be
# called off from any console with `shutdown /a` — which is the only reason
# this is allowed to exist.
shutdown_when_done=false
shutdown_delay_s=60

[Crash]
# Noticing that the client has fallen over, as opposed to merely being between
# screens. Used by `gobot_cli --crashcheck` and `--keepalive <minutes>`.
#
# [Session] above asks "is the HUD there?", which is the right question for an
# interrupted session and the wrong one for a dead client: a crash, a loading
# screen and a death all look identical to it. This asks the other question,
# and there are three answers.
#
#   the process is gone       watched live -- left alone at the character
#                             select this client closes itself after about two
#                             minutes, with no dialog and nothing in its log
#   it has stopped answering  Windows knows; nothing else does, because a
#                             frozen client keeps drawing its last frame
#   a message box is up       the one that carries the error code
#
# The code is READ out of the dialog rather than matched against a picture of
# it, so a code nobody has seen before still comes out right. There are a lot
# of them and nobody has a picture of each.

# The game, the launcher that starts it, and Windows' own crash reporter --
# which puts up "Game.exe has stopped working" on behalf of a program that can
# no longer speak for itself. All three are ended before logging back in:
# leaving the launcher behind means the next crossing finds a window it did
# not put there, and a reporter left running holds the executable open.
game_process=Game.exe
launcher_process=GhostOnlineVTC.exe
reporter_process=WerFault.exe

# How long a window may stay unresponsive before it counts as hung.
#
# Not instant, because it should not be. A client loading a map, or one on a
# machine that is swapping, stops pumping messages for a few seconds at a time
# while nothing is wrong, and restarting the game every time that happens is
# worse than the problem it fixes.
hung_grace_s=20

# Give up after this many restarts, then ask for a person.
#
# A client that crashes once is a crash. A client that crashes five times in a
# row is something restarting will not fix — a bad patch, a full disk, a
# locked account — and a loop that keeps reconnecting to a server which is
# refusing it is indistinguishable from an attack on that server.
max_restarts=5

# Wait this long after ending the client before starting again, so the server
# sees the session close rather than two of them at once.
cooldown_s=15

[Simple]
# The simple screen's own switches. Ticked there; written here.

# Watch the client and log back in when it crashes, hangs or reports a lost
# connection, using configs/login.ini. Runs while the bot runs.
keep_alive=false

# Press the revive button when the character dies (the `revive` sequence in
# configs/routines.ini). Three tries for each death.
revive=false

# During a run, bring the game back to the front when something else has taken
# the focus and nobody has touched the mouse or keyboard for 30 seconds. The
# keys only land while the game is in front.
refocus=true

[Paths]
protocol=configs/protocol.ini
bot_config=configs/bot_default.ini
log=gobot.log
log_level=info
