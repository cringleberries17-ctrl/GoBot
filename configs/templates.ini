# Short names for the game's UI pictures.
#
# The pictures are the game's own artwork -- its dialogs, buttons and item
# icons. They are not kept in this project's source. A machine that has the
# game has them already, and the build stages a copy of whichever set it finds
# next to the executable so that a built bot is self-contained.
#
# Where they come from, best first:
#
#   templates\ beside the executable     staged at build time
#   ZTeam\GoC\data\images                a thousand, named, BOTH interface skins
#   TH_VGO_Bot_Helper\TungHaVGOBot.dll   fewer, unnamed, one skin
#
# The skin matters more than it sounds. This game ships two, kept in `inven\0`
# and `inven\1`, and they do not look alike. The first attempt at this used a
# set extracted from the other one and every match silently failed -- the
# matcher was right and the pictures were of a different program.
#
# What this file is for: the names below read as what they mean, so a feature
# says `store.find("close_button")` rather than naming a path or an ordinal.
# The right-hand side is whatever the source called it.
#
#   gobot_cli --templates           list what loaded, and from where
#   gobot_cli --template <name>     look for one on the screen right now
#
# Nothing here is guesswork that has not been checked: a name is only added
# once --template has found it on a live screen. Anything unverified belongs
# in the list at the bottom, not here.

[Templates]

# ---- buttons, skin 0 -----------------------------------------------------
# Three frames each: resting, hovered, pressed. The resting one is what a
# screen normally shows, so that is the one named.
