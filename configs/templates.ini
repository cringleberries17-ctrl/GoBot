# ---------------------------------------------------------------------------
# PICTURES TAKEN OUT OF THE OTHER HELPER'S ASSEMBLY
# ---------------------------------------------------------------------------
# These are not in the game's data\images -- they were only ever resources
# embedded in TungHaVGOBot.dll. The auto-login pages are the obvious ones, but
# so are the HUD anchor the HP/MP reader measures from and most of the close
# buttons the popup closer uses.
#
# They are cut out as PNGs and kept here rather than shipping that assembly.
# Carrying an 8 MB third-party game-bot DLL in the package got the whole zip
# flagged by Google's scanner, and none of it was ever needed: GoBot only ever
# read these pictures out of it, which is a file read and not a thing that runs.
#
# Its logo, QR code, tool icons and certificate notice are deliberately left
# behind -- they are that project's branding and GoBot matches nothing against
# them.
