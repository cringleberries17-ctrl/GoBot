# The hotbar's frame, for reading how many potions are left on each potion
# key's slot (src/potion_stock.cpp). Cut from the live client's frame.png: the
# frame round the 2 x 9 slots, the slots themselves see-through, each key
# label inside its slot at alpha 64 (hotbar_picture_from). Found at 1.000 on
# every one of the 1,025 saved live frames with the hotbar in view, at both
# client sizes.
hotbar_frame                   = grabbed/hotbar_frame

# The party leader's crown, for telling who leads (src/party_hud.cpp): GoC's
# own two pictures of the game's leader's mark, copied byte for byte -- a red
# frame with a gold crown on its top-left corner. Party_King_My.spr/0.png is
# drawn over the player's own panel at the top left when the player leads,
# Party_King_Other.spr/0.png over another member's panel when that member
# does; inven\0's and inven\1's are the same files. Named here so that a
# package keeps them as GoBot's own, GoC's set or not. The crown on another
# member's panel matched at 1.000 on the four saved frames of the live party
# (2026-10-16); no saved frame has the player leading yet.
party_crown_mine               = grabbed/party_crown_mine
party_crown_other              = grabbed/party_crown_other
