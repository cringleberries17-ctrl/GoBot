# GoBot gathering
#
# Fishing and mining. They are the same loop with different pictures: hold a
# tool, press a key, wait, repeat, and deal with the tool running out. Fishing
# wears through rods; mining breaks pickaxes. Both hand what they gathered to
# an NPC every so often.
#
# The clicking is in configs/routines.ini. What is here is the deciding: when
# the tool has gone, when to stop, when to hold off because health is low.
#
# ---------------------------------------------------------------------------
# WHAT THE SETTINGS MEAN
# ---------------------------------------------------------------------------
#   tool_picture      the tool in the quick slot. When this picture is ABSENT
#                     the tool is gone and wants replacing.
#   broken_picture    a picture meaning the tool is broken but still there --
#                     mining's broken pickaxe. Fishing has no equivalent.
#   buy_routine       which routine replaces it, by its name in routines.ini
#   hand_in_routine   which routine hands the gathered things over
#   work_key          the Win32 key code that casts or mines
#   work_interval_ms  how long one go takes
#   hand_in_every     work cycles between trips to the NPC; 0 means never
#   stop_after        stop after this many cycles; 0 means keep going
#   pause_below_*_pct hold off while health or mana is under this. The healing
#                     feature does the drinking; this only declines to start
#                     another cycle in the meantime.
#   give_up_after     failed replacements in a row before giving up. Without
#                     it, a loop that cannot afford a new rod spends the night
#                     walking into a shop.
#
# ---------------------------------------------------------------------------
# BEFORE THIS RUNS
# ---------------------------------------------------------------------------
# work_key is 0 in both, and the loop refuses to start until it is set: there
# is no sensible default for a key that belongs to your own game settings, and
# guessing one means pressing something unknown every three seconds.
#
# Check the routines first, which looks without clicking:
#
#   gobot_cli --routine buy_fishing_rod --dry
#
# The pictures are the other helper's, read out of its assembly with their own
# names. See --templates.

[Fishing]
name             = fishing
tool_picture     = fishing_rod
broken_picture   =
buy_routine      = buy_fishing_rod
hand_in_routine  =
work_key         = 0
work_interval_ms = 4000
hand_in_every    = 0
stop_after       = 0
pause_below_hp_pct = 0
pause_below_mp_pct = 0
give_up_after    = 3

[Mining]
name             = mining
tool_picture     = pickaxe
broken_picture   = broken_pickaxe
buy_routine      = buy_pickaxe
hand_in_routine  = mining_exchange
work_key         = 0
work_interval_ms = 3000
hand_in_every    = 40
stop_after       = 0
pause_below_hp_pct = 0
pause_below_mp_pct = 0
give_up_after    = 3
