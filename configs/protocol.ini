# GoBot protocol map — GhostOnline wire format
#
# THIS FILE IS DELIBERATELY INCOMPLETE. It cannot be shipped filled in.
#
# GhostOnline's packet format is not published. The commercial client that
# this project replaces did not contain it either: it captured raw frames and
# uploaded them to a vendor server, which held the protocol knowledge and sent
# back movement commands. That is what kept the client useless without a
# subscription.
#
# Replacing that means deriving the protocol from your own traffic. The
# gobot_sniff tool exists for exactly this. Everything above this file is
# written against *semantics*, never against opcode numbers, so filling this
# in is the only step between a capture and a working bot — no recompiling.
#
# ---------------------------------------------------------------------------
# STEP 1 — FRAMING
# ---------------------------------------------------------------------------
#   gobot_sniff --list
#   gobot_sniff --record capture.bin --host <game server ip>
#       ... play for 2-3 minutes: walk, fight, take damage ...
#   gobot_sniff --detect capture.bin
#
# It brute-forces every plausible header layout and ranks them by how cleanly
# they tile the stream. Paste the winning [Framing] block below. Anything under
# 95% coverage is a guess — record a longer single-connection sample.
#
# If nothing tiles at all, the payload is encrypted, and packet capture is the
# wrong approach for this server.
#
# The two directions are framed differently and need detecting separately:
# --record writes a .s2c and a .c2s file, and --detect takes either. Both use
# an eight-byte header with the length at offset 4, but the opcode sits at
# offset 2 coming down and offset 6 going up. A single spec therefore decodes
# one half of the conversation and throws the other half away as noise, which
# is what was happening here until it was measured.
#
# The client half matters more than it looks: the server does not appear to
# echo your own position back to you -- it tells you about everyone else -- so
# what the client reports about itself is the only place your own coordinates
# are to be found.

# Detected from a live capture: 100% coverage, 77 frames, 6 opcodes, no resyncs.
[FramingClient]
header_size=8
length_offset=4
length_size=2
length_endian=little
length_includes_header=false
length_adjust=4
opcode_offset=6
opcode_size=2
opcode_endian=little
min_frame=8
max_frame=32768

[Framing]
# Derived from a real GhostOnline VTC capture (25 KB, 283 frames, 100% tiled
# with zero resyncs). The header looks like this:
#
#     off 0  u16   constant 0x0005          protocol marker
#     off 2  u16   opcode                   7 seen: 0x38 0x2d 0x31 0x4d 0x4a 0xc6 0x4b
#     off 4  u16   total frame length       includes this 8-byte header
#     off 6  u16   checksum                 equals off0 + off2 + off4, exactly
#     off 8  ...   body
#
# header_size is 6 rather than 8 because tiling can only prove where frames
# begin and end, not how much of the front is header. The checksum at offset 6
# therefore arrives as the first two bytes of every payload. Harmless — it just
# means field offsets are two higher than the protocol's own numbering.
#
# Opcode correlates 1:1 with frame size, which is the signature of correct
# framing: 0x38 is always 96 bytes, 0xc6 always 12, and so on.
#
# Re-run `gobot_sniff --detect` if your client build differs.
#
# Set automatically once live traffic shows frames tiling cleanly -- normally
# there is nothing to do here. Whether the framing is right is measurable: a
# wrong spec resyncs constantly, a right one does not. Watch the resync count
# against frames decoded; more than a couple of bytes per frame means wrong.
#
# This is a different question from whether a *field layout* is right, which no
# measurement can settle and which still needs you to compare decoded values
# against what the game shows.
verified=true

header_size=8
length_offset=4
length_size=2
length_endian=little
length_includes_header=true
length_adjust=0
opcode_offset=2
opcode_size=2
opcode_endian=little
min_frame=8
max_frame=16384

# Offset of the header check word, which equals the sum of the other header
# u16s. This is what keeps the scanner locked.
#
# Length alone cannot distinguish a real frame header from two bytes that
# happen to read as a plausible size, so after any disruption the scanner
# latches onto a bogus large length and swallows hundreds of real frames
# inside one enormous fake one. Verifying the checksum makes each boundary
# independently provable: a wrong guess survives with probability 1/65536.
checksum_offset=6

# Opcode 0x0081 carries twelve bytes past its declared length.
#
# This was costing most of the stream. The scanner finished an 0x0081 frame,
# met twelve bytes it could not parse, and resynced -- and a resync does not
# cost one frame, it costs alignment: it slides a byte at a time, swallowing
# real frames, until something parses again. One 0x0081 every few hundred
# frames was enough to hide the majority of the traffic, and the symptom looked
# like a wrong FramingSpec rather than a right one with an exception in it.
#
# Measured across four captures (stand / track / walk / probe), as
# frames-recovered/resyncs at each candidate trailer size:
#
#     trailer=0    339/275   192/721   317/829   143/512
#     trailer=11    339/55   192/402   317/312   143/259
#     trailer=12     450/0     715/0     603/0     160/0   <-- 100% coverage
#     trailer=13  336/1124  232/2395  306/2068  134/1415
#
# track went from 192 frames to 715: the bot had been seeing 27% of what the
# server sent, which is a large part of why so little of the world model was
# right. The trailer is stripped from the payload, so field offsets within
# 0x0081 are unaffected.
#
# If another opcode turns out to do the same, this needs to become a list.
trailer_opcode=0x0081
trailer_bytes=12

# ---------------------------------------------------------------------------
# STEP 2 — FIND THE OPCODES
# ---------------------------------------------------------------------------
#   gobot_sniff --watch
#
# Shows a live histogram. Correlate by doing one thing at a time:
#   walk back and forth  -> the high-rate opcode is position
#   stand still, get hit -> a new opcode appears: HP
#   pull a monster       -> monster spawn / update
#   kill it              -> monster remove
#
# ---------------------------------------------------------------------------
# STEP 3 — FIND THE FIELDS
# ---------------------------------------------------------------------------
#   gobot_sniff --diff 0x1234
#
# Collects many instances of one opcode and reports which byte offsets change.
# Constant bytes are sub-type tags or padding; smoothly-changing 4-byte runs
# are coordinates; bytes that move only when you take damage are HP. It prints
# each candidate run read as both int and float, which usually settles it.
#
# ---------------------------------------------------------------------------
# FIELD SYNTAX
# ---------------------------------------------------------------------------
#   name:type[@offset][*scale]
#
#   types   i8 u8 i16 u16 i32 u32 i64 u64 f32 f64
#           str8 str16 str32   length-prefixed string
#           strz              NUL-terminated
#           strfN             fixed N bytes
#           bytesN            raw N bytes
#           skipN             advance N bytes, emit nothing
#
#   suffix  'be' for big-endian, e.g. u16be
#   @N      read at absolute payload offset N instead of sequentially
#   *N      multiply the value, for fixed-point coords, e.g. x:i16*0.125
#
# Field names the bot understands (aliases accepted where listed):
#   id / monster_id / player_id / entity_id
#   x / pos_x,  y / pos_y
#   hp,  max_hp / hp_max,  mp,  max_mp / mp_max
#   kind / type / template_id,  name,  level,  exp
#   flying / is_fly,  boss / is_boss,  facing
#   sender / from,  text / message / msg
#   map / map_name,  map_id,  width, height, tile_w, tile_h, attrs
#
# Semantics (this is what the bot actually dispatches on):
#   self_state self_hpmp self_move self_dead self_revive self_exp
#   monster_spawn monster_update monster_remove monster_selected
#   player_spawn player_move player_remove
#   item_drop item_remove
#   map_warp map_data
#   party_update party_invite party_leave party_hp
#   chat skill_confirm attack_confirm buff_applied captcha disconnect
#
# ---------------------------------------------------------------------------
# MINIMUM VIABLE SET
# ---------------------------------------------------------------------------
# The bot needs three things before it can fight at all:
#   1. self_state or self_move  -> where we are
#   2. self_hpmp                -> when to drink
#   3. monster_update           -> what to hit
# Everything else is refinement.
#
# ---------------------------------------------------------------------------
# DERIVED FROM LIVE CAPTURE — these ones are real.
# ---------------------------------------------------------------------------

# The server's entity broadcast. By far the loudest thing on the wire: 1336 of
# 2095 frames in a two-and-a-half minute capture, 88 bytes each, about nine a
# second.
#
# How it was read, so the next person can check the work instead of trusting it:
#
#   off  8  u32le  entity slot, 0..37. Small, dense, and stable for the life of
#                  a creature -- grouping a capture by it splits the stream into
#                  one tidy series per creature, which is what an index is for
#                  and what no other field in the packet manages.
#   off 20  f32    speed. Reads 0.0, 1.5, 1.6 and 1.7 and nothing else, across
#                  thousands of frames. Speeds, not coordinates.
#   off 80  u16le  x
#   off 82  u16le  y
#
# The coordinates were settled by grouping rather than by correlation. Split by
# slot, most slots report one position and never change it -- stationary
# monsters, at plausible map coordinates -- while a handful move smoothly. A
# field that is constant per creature, different between creatures, and inside a
# range matching a map about 6400 by 1200, is a position.
#
# Correlating this packet against the screen found nothing, and that absence is
# itself a finding: none of these creatures is you. The server tells you where
# everyone else is and does not tell you about yourself. Your own position is
# not in the client's half either -- that stream is obfuscated, and the last
# eight bytes of every frame change even while the character stands still.
#
# It is recovered instead by matching these world coordinates against the same
# creatures on screen: that difference is where the camera is, and the character
# is in the middle of the camera.
# 0x0038 CARRIES A SUB-TYPE AT OFFSET 4. Measured over 3,693 packets:
#
#     @4 = 1   x1842   @20,@21 = 102,102   @23 = 64    position unchanged
#     @4 = 0   x1802   @20,@21 = 0,0       @23 = 0     position unchanged
#     @4 = 9   x49     @40..43 = 161,3,0,0 @58,@59=255 position CHANGES
#
# Each value has its own set of live fields, so the same offset means different
# things under each. Anything read from an offset without splitting on @4 first
# is three layouts averaged together, which is what made every earlier attempt
# at this packet come out mushy.
#
# Sub-type 9 is a MOVE event, watched end to end on creature 17:
#
#   frames  21..335   at (502,824), sub 0/1 alternating,
#                     @40..43 = 255,255,255,255 and @44..60 all zero
#   frame   359       sub 9: position becomes (802,858) and the move
#                     parameters appear -- @40..45 = 161,3,0,0,69,148,
#                     @48 = 11, @52 = 162, @58..60 = 255,255,200
#   frames  403..     at (802,858), sub 0/1, parameters back to resting
#
# So 0 and 1 restate a creature that is where it already was, and 9 is the one
# that relocates it. @40..45/@48/@52/@58..60 are that move's parameters --
# destination, speed or duration -- and are meaningless under 0 and 1, where
# they read 255/0.
#
# The field syntax here has no way to express that yet. Until it does, the
# fields below are the ones that hold under every sub-type.
#
# CONFIRMED on a single-map capture (1,047 packets, 43 creatures):
#   id  @8   46 distinct values 0..45, exactly one per creature, fixed for life
#   x,y @80,@82   38 of 43 creatures perfectly stationary, median span 0 --
#                 which is what a position looks like when most monsters stand
#                 on their spawn point
#
# NOT the position, despite looking like one:
#   @24,@26   varies for ALL 43 creatures, median span 1481, including ones
#             whose @80/@82 never moves at all. For a creature fixed at
#             (959,1868) it reads (795,1924) (267,1847) (48,1829) (566,1895) --
#             x sweeping the map while y stays in a band. That is a SECOND
#             actor's position, so this packet describes more than one thing.
#             Unidentified; do not map it as the subject's coordinates.
#
# STILL MISSING: hp, max_hp, kind, alive. No field is constant per creature
# except the id, so there is no max_hp here and therefore no hp/max_hp pair.
# Health is a separate message. Entities are never removed from the stream --
# across windows up to 400 frames, 0% of ids ever go quiet -- so a dead monster
# is still reported, with something changed. @84 (values 1 and 2, fixed for 34
# of 46 creatures) is the best alive/dead candidate and is untested.
#
# 0x0723 was checked as a remove message and is NOT one: the id it names keeps
# being reported 100% of the time afterwards.
#
# DEATH IS NOT IN 0x0038 AT ALL. Confirmed with the player killing monsters:
# the creature count in the commercial client stays at 43 throughout, no id is
# ever removed from the stream, and no field changes within a creature's life
# except the sub-type-9 move parameters. That count is a tally of entity SLOTS,
# not of living creatures, and 0x0038 reports all of them regardless.
#
# So combat lives elsewhere. Comparing a quiet capture against one where the
# player was fighting, by rate per second:
#
#     opcode   quiet   fighting   ratio
#     0x004D    0.00     0.22      combat only
#     0x004A    0.014    0.27      x19
#     0x003F    0.014    0.27      x19
#     0x0723    0.03     0.47      x16
#     0x0081    0.19     1.62      x8.5
#
# 0x004D does not occur at all unless the player is fighting. See below.
[Packet.0x0038]
name=EntityUpdate
semantic=monster_update
fields=id:u32@8,speed:f32@20,x:u16@80,y:u16@82

# 0x004D -- the combat event. 32-byte payload, absent unless fighting.
#
#   @0..7    constant  00 00 00 00 A1 03 00 00
#   @8       u8        target entity id -- same id space as 0x0038 (@8),
#                      values 0..3 seen because only four creatures were hit
#   @12..14            four distinct triples; attacker or skill
#   @18..20            mostly 255,255,255; occasionally 57,0,255 / 255,255,12
#   @24      u16       0..369, thirteen distinct: 348 333 333 0 362 344 0 369
#                      -- a damage number, with 0 for a miss
#
# NOT YET VERIFIED. @24 is a damage number on its values alone; nobody has
# compared it against a figure on screen. Do that before anything depends on
# it -- the game draws the damage over the creature, so it can be read.
#
# If @24 is damage, summing it per target between respawns gives max_hp without
# ever finding an hp field, which is the cheapest route to "stop hitting things
# that are already dead".
# [Packet.0x004D]
# name=CombatEvent
# semantic=damage
# fields=target:u8@8,damage:u16@24

