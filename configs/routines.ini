# GoBot routines
#
# Sequences of clicks through the game's own dialogs, kept here rather than in
# code. Buying a fishing rod, mining a vein, opening a crest box and setting a
# party's loot rule are all the same shape: find a picture, click it, wait for
# something that proves the click landed.
#
# Written as code that would be twenty near-identical functions, each with its
# own retry loop, each needing a rebuild when the publisher moves a button four
# pixels. Written here it is a table you can correct in a text editor with the
# game open in front of you -- which is the only way this survives a patch.
#
# ---------------------------------------------------------------------------
# WRITING A STEP
# ---------------------------------------------------------------------------
#   <n>.find        the picture that marks the thing to click
#   <n>.confirm     a picture that must APPEAR afterwards, proving it landed
#   <n>.gone        true: confirmed instead by `find` DISAPPEARING
#   <n>.optional    true: not finding `find` is fine, carry on
#   <n>.click_dx    where to click from the picture's top-left corner;
#   <n>.click_dy      leave both out to click its middle
#   <n>.score       how well it has to match, 0..1 (default 0.80)
#   <n>.wait_ms     how long to wait for `find` (default 6000)
#   <n>.confirm_ms  how long to wait for the confirmation (default 4000)
#   <n>.attempts    clicks before giving up (default 3)
#
# Every step must have either `confirm` or `gone`. A step that cannot show it
# worked is refused rather than run: a click that misses leaves the screen
# exactly as it was, so a sequence that clicks and carries on will walk itself
# into nothing and report success.
#
# Steps are numbered from one and stop at the first gap, so commenting one out
# truncates the routine instead of silently shifting the rest up.
#
# ---------------------------------------------------------------------------
# THE PICTURE NAMES
# ---------------------------------------------------------------------------
# These come from the other helper's assembly, read out with their own names:
#
#   gobot_cli --tplsrc "C:\Program Files\TH_VGO_Bot_Helper\TungHaVGOBot.dll" --templates
#
# 357 of them, named as that helper named them -- `fishing_rod`, `pickaxe`,
# `mining/npc_menu`, `close_ic/close_2`. The ones below are the subset phase
# one needs.
#
# ---------------------------------------------------------------------------
# STATUS
# ---------------------------------------------------------------------------
# The click offsets and the exact order are written from the picture names, not
# from watching the game. They are a starting point, and the first live run is
# expected to correct them. Check one with:
#
#   gobot_cli --routine <name> --dry
#
# which finds each step's picture and reports where it would click, without
# clicking anything.

# ---------------------------------------------------------------------------
# SHOPPING
# ---------------------------------------------------------------------------
# Buying is the dependency of both gathering features: a rod wears out, a
# pickaxe breaks, and neither loop can keep going without replacing them.
#
# The shape is the same for all three items -- pick it out of the shop's list,
# press buy, confirm -- so they differ only in which icon is picked.

[Routine.buy_fishing_rod]
1.find    = rod_in_shop
1.confirm = ngs_buy_button
2.find    = ngs_buy_button
2.confirm = confirm_button
3.find    = confirm_button
3.gone    = true

[Routine.buy_bait]
1.find    = baiter_in_shop
1.confirm = ngs_buy_button
2.find    = ngs_buy_button
2.confirm = confirm_button
3.find    = confirm_button
3.gone    = true

[Routine.buy_pickaxe]
1.find    = buy_pickaxe
1.confirm = ngs_buy_button
2.find    = ngs_buy_button
2.confirm = confirm_button
3.find    = confirm_button
3.gone    = true

# ---------------------------------------------------------------------------
# MINING
# ---------------------------------------------------------------------------
# Talk to the NPC, open its menu, and hand over what was dug up. The pickaxe
# breaking is what drives the loop, and that is a single icon swapping for
# another -- an exact match, not a judgement call -- so the code watches for
# `broken_pickaxe` and calls `buy_pickaxe` when it appears.

[Routine.open_mining_npc]
1.find    = mining_npc
1.confirm = mining/npc_menu

[Routine.mining_exchange]
1.find       = mining/npc_menu
1.confirm    = mining/exchange_menu
2.find       = mining/exchange_menu
2.confirm    = confirm_button
2.optional   = true
3.find       = confirm_button
3.gone       = true
3.optional   = true

# ---------------------------------------------------------------------------
# TIDYING UP
# ---------------------------------------------------------------------------
# What to do when something unexpected is on screen. Every other routine calls
# this first, which is why it is written to pass when there is nothing to close.

[Routine.close_anything]
1.find     = close_ic/close_1
1.gone     = true
1.optional = true
1.wait_ms  = 800
2.find     = close_ic/close_2
2.gone     = true
2.optional = true
2.wait_ms  = 800
3.find     = close_ic/close_3
3.gone     = true
3.optional = true
3.wait_ms  = 800
4.find     = close_ic/close_4
4.gone     = true
4.optional = true
4.wait_ms  = 800
5.find     = close_ic/close_5
5.gone     = true
5.optional = true
5.wait_ms  = 800
6.find     = close_ic/close_6
6.gone     = true
6.optional = true
6.wait_ms  = 800
7.find     = close_ic/close_7
7.gone     = true
7.optional = true
7.wait_ms  = 800
8.find     = close_ic/close_8
8.gone     = true
8.optional = true
8.wait_ms  = 800


# ---------------------------------------------------------------------------
# DYING
# ---------------------------------------------------------------------------
# Not a table any more. Reviving is built into GoBot (src/reviver.cpp), the way
# GoC does it: the death panel is found by two corners of its buttons, its
# "Su dung vat pham hoi sinh" is clicked and then Xac Nhan on the question --
# three tries for each death, never the village (-2% EXP) or Cash, and nothing
# at all while the trash bin's dialog is up. The revive question's picture
# looks enough like the bin's that a table clicking it at the usual score could
# answer the bin's instead, and the bin's Xac Nhan deletes an item.
#
# An older copy of this file may still have a [Routine.revive]. Nothing runs it:
# the GUI and `gobot_cli --routine revive` use the built-in reviver, and
#
#   gobot_cli --routine revive --dry
#
# shows what it sees and where it would click, without clicking.
