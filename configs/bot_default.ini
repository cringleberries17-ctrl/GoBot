# GoBot bot configuration
#
# Schema follows the layout of the original client's bot_s0_default.ini, so
# existing configs port across with minimal editing.

[Bot]
# Everything that acts on the game ships off, as in every config here: the
# attack, every skill, turning to face a target and stepping back from one.
# The attack and skills are ticked under Attack on the Features tab of the
# full screen (Nang cao) once the protocol map can place your character, and
# until then only here. Set them before START BOT.
#
# The packet bot's potions and buffs are the macro's (configs/macro.ini: the
# simple screen's potion and Tu buff rows, or Timed keys): they go while the
# macro runs, on the HP and MP the packets give. This file has none.
auto_attack=false
auto_fury=false
fury_skill_points=0
double_jump=false
backing_away=false

# lazy_mode: wait for monsters to walk into range instead of chasing them.
# Slower, but far less conspicuous and it never walks off a ledge. Stays on:
# it is the setting that moves less.
lazy_mode=true

face_target=false
facing_tolerance=12
auto_loot=false
ignore_fly_monster=true
allow_attack_while_jumping=false

# Requires a map_data packet mapped in protocol.ini. Off until you have one.
enable_tile_pathfinding=false

# 0=nearest  1=lowest hp %  2=highest hp %  3=lowest absolute hp
target_mode=0
min_range=0
attack_range=350

# Engagement box in map coordinates. Monsters outside it are ignored, which
# keeps the bot from wandering into a neighbouring spawn.
working_min_x=0
working_min_y=0
working_max_x=1024
working_max_y=1024

# Vertical reach. Side-scroller hitboxes are asymmetric: you reach further
# below you than above.
highest_hit_y=150
lowest_hit_y=63
higher_threshold=150
lower_threshold=63

# true = rotate through enabled skills; false = always prefer the lowest slot
sequential_skill=true

return_to_original_location=false
return_to_previous_map=false
continue_auto_after_death=false
priority_boss=false
overcome_obstacles=false
fix_location_after_login=false
return_delay=0
return_tolerance_x=48
return_tolerance_y=31

# --- skills -----------------------------------------------------------------
# cooldown is in milliseconds.
# aoe_*  bounds are relative to the player and mirror with facing.
# targets = minimum monsters inside the AoE box before this skill fires, so a
#           wide cleave waits for a crowd instead of being wasted on one mob.

skill_0_key=Z
skill_0_keycode=90
skill_0_cooldown=1000
skill_0_enabled=false
skill_0_aoe_min_x=0
skill_0_aoe_max_x=200
skill_0_aoe_min_y=0
skill_0_aoe_max_y=0
skill_0_hits=1
skill_0_targets=1

skill_1_key=X
skill_1_keycode=88
skill_1_cooldown=2000
skill_1_enabled=false
skill_1_aoe_min_x=0
skill_1_aoe_max_x=300
skill_1_aoe_min_y=0
skill_1_aoe_max_y=0
skill_1_hits=1
skill_1_targets=1

skill_2_key=C
skill_2_keycode=67
skill_2_cooldown=5000
skill_2_enabled=false
skill_2_aoe_min_x=0
skill_2_aoe_max_x=350
skill_2_aoe_min_y=0
skill_2_aoe_max_y=0
skill_2_hits=1
skill_2_targets=2

skill_3_key=V
skill_3_keycode=86
skill_3_cooldown=8000
skill_3_enabled=false
skill_3_aoe_min_x=0
skill_3_aoe_max_x=400
skill_3_aoe_min_y=0
skill_3_aoe_max_y=0
skill_3_hits=1
skill_3_targets=3

skill_4_keycode=0
skill_4_enabled=false
skill_5_keycode=0
skill_5_enabled=false
skill_6_keycode=0
skill_6_enabled=false
skill_7_keycode=0
skill_7_enabled=false

[Heal]
# Potions are not here any more: they are macro.ini's. An hp_heal*, mp_heal1,
# auto_buff or buff_N key left in an older copy of this file is not read.
player_auto_revive_enabled=false
player_revive_max_attempts=3

[KeyConfig]
# Win32 virtual-key codes.
key_jump=17
key_normal_attack=32
key_fury=96
key_left=37
key_right=39
key_up=38
key_down=40
key_loot=90
# gobot_cli's key that switches the packet bot on and off (121 = F10).
# gobot_gui does not use it: there the packet bot is started and stopped
# with START BOT / STOP BOT (F12 stops it too), and F10 is macro.ini's
# toggle_key.
key_start_stop=121

[Patrol]
patrol_use_waypoints=false
patrol_loop_cycle=false
patrol_sweep_mode=false
patrol_killall_goal_pct=100

[Timing]
# Randomised gap between actions, in ms. Uniform-rate input is the clearest
# signal that a client is automated, so never set min == max.
command_delay_min=40
command_delay_max=90
attack_interval_ms=120
decision_interval_ms=80
