# GoBot hunting
#
# Picks a monster off the screen and goes for it. Everything here is editable
# on the GUI's Radar tab; this file is just where it is kept.
#
# How the monsters are found: every creature in this game wears a dark name box
# with a red health bar under it. Players have a blue mana bar as well and
# monsters do not, which is the whole of the difference between "attack this"
# and "leave this alone". Nothing is read out of the game's memory and no
# packets are decoded.
#
# The game will not draw itself into a bitmap on request, so the picture is
# lifted off the screen -- which means anything covering the game is read
# instead of the game. Keep the GoBot window off it. The Radar tab says so when
# it is in the way, and will move itself.

[Hunt]
# Whether START on the simple screen goes hunting: its "Tự đánh quái" switch.
# The hunter itself ignores it -- F11 and the full screen's Attack switch start
# it regardless.
enabled=false

# Your character's name, exactly as the game writes it under your feet.
#
# This is how the bot sees its own character. Every creature on screen is found
# by the red health bar it wears, and a plate with bars may be yours or another
# player's: the bars say a player stands there, not which one. What says which
# is the name, written beneath each character -- so the bot goes and reads the
# screen for this one, whole: a player whose name has yours inside it, or is a
# letter away from it, is not you.
#
# Leave it blank and the bot can see the monsters but not itself, and so cannot
# walk to any of them. Needs the game's glyph set installed to read with.
character_name=

# Win32 virtual-key codes.
#   90 = Z    0x25 = 37 = Left    0x27 = 39 = Right    0x26 = 38 = Up
#   0x20 = 32 = Space    122 = F11
attack_key=90
left_key=37
right_key=39
toggle_key=122

# The game's jump key, for the hop towards a monster above: "Phím nhảy" on the
# simple screen, with its "Thử" -- one press, watching whether the character
# jumps. 0 is none, and the hunter never hops. It ships with none: a key that
# acts on the game is the player's to give. GoC takes Up (38) for its jump;
# Space (32) is this game's attack, so a hop on it attacks instead. A file
# without this key gets Space, which is what every one before it said.
# jump_checked: whether "Thử" saw the character jump on it.
jump_key=0
jump_checked=false

# How close, in screen pixels, before it stops walking and starts hitting.
# Set this to about how far your attack actually reaches: the boxes drawn on
# the Radar tab's view are in these same pixels, so you can measure it.
reach=150

# How far above or below a monster may be and still count as reachable. Larger
# than this and the bot swings at things standing on other platforms.
height_tolerance=60

# "Kiểu đánh" on the simple screen: a class and weapon, which loads one of
# GoC's four sets of ranges (its sample_config.ini). Empty is "Như trước", the
# hunter as it always was; any style turns GoC's own rules on as well -- a
# target in reach is fought until it dies rather than picked afresh every
# give_up_ms, one whose bar has not gone down in no_damage_ms of attacking is
# given up on (never one on first_monsters), and the character turns only
# when it is not facing the target already.
#   style         the style's id: vo_si_dao, xa_thu_phao_cao, luan,
#                 vo_si_kiem_thap, xa_thu_phao_thap, vuot, riu, dao_si,
#                 vo_si_kiem_cao, xa_thu_cung, tieu, near_wide, near_narrow,
#                 far_wide, far_narrow -- or empty
#   min_distance  GoC's minRange: the closest a monster should be, for
#                 keep_distance below; 0 = none (50 for keep_distance)
#   up_reach / down_reach      how far above / below a monster can be hit
#                              (GoC's highestHitY / lowestHitY)
#   up_no_jump / down_no_jump  how far above / below without jumping
#                              (higherThreshold / lowerThreshold)
# The four band numbers at -1 follow height_tolerance, and half of it without
# jumping: the band the hunter has always had.
style=
min_distance=0
up_reach=-1
down_reach=-1
up_no_jump=-1
down_no_jump=-1
no_damage_ms=15000

# A target it cannot reach in this long is abandoned for the next one. Without
# it the bot walks into the wall under a ledge for the rest of the session.
give_up_ms=4000

# How long one walking step holds the direction key down.
step_ms=180

# Gap between the hunter's own swings. Your skill timers on the Macro tab keep
# running alongside this.
attack_interval_ms=700

# Hop when the target is above and out of reach. Cheap to try; the give-up
# timer handles the case where it does not help.
jump_to_reach=true

# Pick up what the monsters drop, with the game's pick-up key (a VK code; 0 =
# not set). Pressed a few times straight after each kill, and every
# loot_interval_ms while fighting. "Tự nhặt đồ" on the simple screen.
loot=false
loot_key=0
loot_interval_ms=2000

# Stand still: attack whatever comes within reach and never walk to anything.
# For a spot the monsters come to. "Đứng yên một chỗ" on the simple screen.
stay_put=false

# "Giữ khoảng cách": step back from a monster nearer than min_distance (50 px
# with none set), as GoC's backing_away does, before attacking it. It moves
# the character, so it ships off. Never while standing still, never from a
# monster off the character's own level, and never more than
# keep_distance_steps steps in a row (1-10): GoBot cannot see where a
# platform ends.
keep_distance=false
keep_distance_steps=3

# How far to the side, in pixels, a monster may be before the character turns
# to it: GoC's "Hạn chế quay người".
facing_tolerance=12

# The monster lists: "Lọc quái" on the simple screen's Đánh quái tab. Names as
# the game writes them on the plates, separated by commas, at most 20 in each.
# Matched loosely, because they are read off the screen: accents, capitals and
# spaces do not count, and a name of five letters or more may have one letter
# in five wrong or missing. A name of four letters or fewer must match exactly.
#   skip_monsters   "Không đánh": never attacked.
#   first_monsters  "Đánh trước": gone for before any other on the same level,
#                   and taking over from another being fought once in reach.
#   first_only      attack only those on first_monsters, as GoC's "Loại mob".
# A name on both lists is not attacked. Empty lists change nothing.
skip_monsters=
first_monsters=
first_only=false

# Only send input while the game window has focus. Leave this on. With it off
# the arrow keys go to whatever window is in front.
require_focus=true

# Bring the game to the front when hunting is switched on. Clicking START
# HUNTING takes focus off the game, and with require_focus on the hunter will
# not send anything to an unfocused window -- so without this it starts and
# reports "waiting for the game to have focus" forever.
#
# Only on the way on. Taking the foreground back during a run is a separate
# choice -- refocus in [Simple] in app.ini -- and waits for the machine to go
# idle first.
focus_on_start=true

[Move]
# Walking to saved places, and patrolling between them.
#
# Positions are worked out by watching the scenery slide: between two frames
# the background shifts by exactly how far the view moved, and adding those up
# gives where the view is looking. That plus the character's place on screen is
# a position in the level rather than in the window.
#
# The origin is wherever tracking started, so it only means the same thing
# tomorrow once it has been pinned to something the level defines. Walking into
# the left-hand edge of the map does that -- the view stops while the character
# keeps going -- and the Radar tab says whether it has happened yet.

left_key=37
right_key=39
jump_key=32

# Close enough to count as arrived, in level pixels.
arrive_tolerance=40

# One walking step.
step_ms=180

# A wall, a gap and a ledge it cannot climb all look the same from here. After
# this long the leg is abandoned and the next one started.
leg_timeout_ms=20000

# Pause at each end of a patrol.
dwell_ms=800

require_focus=true

