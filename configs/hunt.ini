# GoBot hunting
#
# Picks a monster off the screen and goes for it. Everything here is editable
# on the GUI's Radar tab; this file is just where it is kept.
#
# How the monsters are found: every creature in this game wears a dark name box
# with a red health bar under it. Players have a blue mana bar as well and
# monsters do not, which is the whole of the difference between "attack this"
# and "leave this alone". Nothing is read out of the game's memory. The game's
# packets are only read, for where you and the monsters are, as
# packet_positions below says.
#
# The game will not draw itself into a bitmap on request, so the picture is
# lifted off the screen -- which means anything covering the game is read
# instead of the game. Keep the GoBot window off it. The Radar tab says so when
# it is in the way, and will move itself.

[Hunt]
# Whether START on the simple screen goes hunting: its "Tự đánh quái" switch.
# The hunter itself ignores it -- F11 and the full screen's Attack switch start
# it regardless.
enabled=false

# Your character's name, exactly as the game writes it under your feet.
#
# This is how the bot sees its own character. Every creature on screen is found
# by the red health bar it wears, and a plate with bars may be yours or another
# player's: the bars say a player stands there, not which one. What says which
# is the name, written beneath each character -- so the bot goes and reads the
# screen for this one, whole: a player whose name has yours inside it, or is a
# letter away from it, is not you.
#
# Leave it blank and the bot can see the monsters but not itself, and so cannot
# walk to any of them. Needs the game's glyph set installed to read with.
character_name=

# Win32 virtual-key codes.
#   90 = Z    0x25 = 37 = Left    0x27 = 39 = Right    0x26 = 38 = Up
#   0x20 = 32 = Space    122 = F11
attack_key=90
left_key=37
right_key=39
toggle_key=122

# The game's jump key, for the hop towards a monster above: "Phím nhảy" on the
# simple screen, with its "Thử" -- one press, watching whether the character
# jumps. 0 is none, and the hunter never hops. It ships with none: a key that
# acts on the game is the player's to give. GoC takes Up (38) for its jump;
# Space (32) is this game's attack, so a hop on it attacks instead. A file
# without this key gets Space, which is what every one before it said. A hop
# never comes while the last is still in the air (about 0.8 s), where a second
# press would be a second jump. Down (40) is never pressed, here or for any
# other key: standing on a gate it takes the character to another map. Up is
# safe on a gate, and so is Ctrl + Up (the owner's hand test, 2026-11-05: no
# map change), and this game has no ropes.
# jump_checked: whether "Thử" saw the character jump on it.
jump_key=0
jump_checked=false

# How close, in screen pixels, before it stops walking and starts hitting.
# Set this to about how far your attack actually reaches: the boxes drawn on
# the Radar tab's view are in these same pixels, so you can measure it.
reach=150

# How far above or below a monster may be and still count as reachable. Larger
# than this and the bot swings at things standing on other platforms.
height_tolerance=60

# "Kiểu đánh" on the simple screen: a class and weapon, which loads one of
# GoC's four sets of ranges (its sample_config.ini). Empty is "Như trước", the
# hunter as it always was; any style turns GoC's own rules on as well -- a
# target in reach is fought until it dies rather than picked afresh every
# give_up_ms, and one whose bar has not gone down in no_damage_ms of attacking
# is given up on (never one on first_monsters). With a style or without, the
# character turns only when it is not facing the target already.
#   style         the style's id: vo_si_dao, xa_thu_phao_cao, luan,
#                 vo_si_kiem_thap, xa_thu_phao_thap, vuot, riu, dao_si,
#                 vo_si_kiem_cao, xa_thu_cung, tieu, near_wide, near_narrow,
#                 far_wide, far_narrow -- or empty
#   min_distance  GoC's minRange: the closest a monster should be, for
#                 keep_distance below; 0 = none (50 for keep_distance)
#   up_reach / down_reach      how far above / below a monster can be hit
#                              (GoC's highestHitY / lowestHitY)
#   up_no_jump / down_no_jump  how far above / below without jumping
#                              (higherThreshold / lowerThreshold)
# The four band numbers at -1 follow height_tolerance, and half of it without
# jumping: the band the hunter has always had.
style=
min_distance=0
up_reach=-1
down_reach=-1
up_no_jump=-1
down_no_jump=-1
no_damage_ms=15000

# A target it cannot reach in this long is abandoned for the next one. Without
# it the bot walks into the wall under a ledge for the rest of the session.
# One not within reach at any moment of it is passed over for twice as long,
# one on first_monsters too, so that it is not picked straight back.
give_up_ms=4000

# Walk to a target with the direction key held down until the walk is over,
# as a player walks. false: each look presses a step of step_ms and lets go,
# as GoBot used to -- which stops the character between steps, several times
# a second.
hold_walk=true

# How long one walking step holds the direction key down, with hold_walk=false.
step_ms=180

# Gap between the hunter's own swings. Your skill timers on the Macro tab keep
# running alongside this.
attack_interval_ms=700

# Hop when the target is above and out of reach. Cheap to try; the give-up
# timer handles the case where it does not help. With no hop to follow (this
# false, no jump key, or spot=true) and a map file to go by (the "Bản đồ"
# tab's area, or with spot=false the map drop_down trusts), a monster above
# that does not stand on the character's own floor is not picked once nothing
# on the level or below is left (since 2026.11.04d). This run's spot, with no
# saved area, picks as before.
jump_to_reach=true

# "Nhảy xuống bậc dưới": drop through the platform underfoot with Ctrl + Down
# to the target on a floor below -- more than drop_min_px below (or the band
# below, if larger), no more than drop_side_px to the side, and nothing to
# fight on your own level. The key is fixed: Down only ever goes with Ctrl
# held, Down up first, then Ctrl. Only with packet_positions=on, never with
# stay_put, and with spot=true only where you stand, land and the target are
# all inside its area. Only on a map GoBot saw you enter (a door, or a log in
# with GoBot open), or named from where you and the monsters stand; it reads
# the game's own map files (data\Map, data\Project) and drops only where you
# land on the target's floor or one between, never past it, never through
# the bottom ground, and never with a gate within drop_gate_px across. Two
# settled points of yours off the file's floors, 0.5 s apart with none on
# them between, stop drops on that map until the next map entry (one named
# from standing points is named afresh); a monster's point never does. A
# press that did nothing is remembered; 3 in a row, or 5 in a run, switch
# drops off until the next start. A map change within 10 s of a press stops
# hunting and switches this off, saved here. Ctrl + Down on a gate changes
# the map: keep drop_gate_px at 150 or more. It moves the character, so it
# ships off. Since 2026.11.04d the floors are followed as they run, slopes
# too, and with a drop able to go the hunter stops within 24 px across of
# the target below and judges the drop from where it then stands.
#   drop_min_px   60-470    drop_side_px  20-300    drop_gate_px  40-400
#
# Nhảy xuống bậc dưới (Ctrl + ↓) khi con quái đang nhắm ở bậc thấp hơn và trên
# bậc đang đứng không còn con quái nào. Chỉ khi có packet_positions=on, không
# có stay_put; có spot=true thì chỉ nhảy trong vùng đánh. Chỉ nhảy khi file bản
# đồ của game cho thấy sẽ rơi xuống đúng bậc của quái (hoặc bậc ở giữa), không
# rơi quá, không ở nền dưới cùng, không gần cửa. Nhân vật hai lần đứng ở chỗ
# không có bậc (cách nhau 0,5 giây) thì thôi nhảy trên bản đồ đó; chỗ của quái
# thì không bao giờ. Nhảy mà đổi bản đồ thì GoBot dừng đánh quái và bỏ dấu ô
# này. GoBot không bao giờ bấm ↓ một mình. Từ bản 2026.11.04d nhảy được cả
# trên bục dốc, và bot đứng lại khi còn cách con quái không quá 24 px theo
# chiều ngang rồi mới xét.
drop_down=false
drop_min_px=100
drop_side_px=120
drop_gate_px=150

# "Nhảy lên bục trên" (since 2026.11.05b): jump straight up -- Up, Up Up or
# Ctrl + Up, chosen by the game's own map file with a margin -- onto the floor
# of a monster above, and onto the floors of the way back to the home. Only
# with a hunting area drawn on the "Bản đồ" tab (spot=true), on a map GoBot
# trusts as for drop_down, packet_positions=on, stay_put=false and jump_key=38
# (Up); the take-off, the landing and the monster all inside the area, and no
# floor outside the area within 650 px above the take-off. At most 4 a minute
# and 2 for one monster; 3 that did not get up in a row, or 5 in a run, switch
# it off until the next start. A map change within 10 s of a jump stops
# hunting and switches this off, saved here. On by default; false presses
# nothing new and only writes in the log where a jump would have gone.
#
# Nhảy thẳng lên bục phía trên để đánh quái trên đó và để về chỗ về. Chỉ khi có
# vùng đánh quái vẽ ở tab "Bản đồ", packet_positions=on, không Đứng yên và phím
# nhảy là ↑ (38); chỗ đứng nhảy, chỗ rơi xuống và con quái đều trong vùng. Bật
# sẵn; false thì không bấm gì mới, chỉ ghi vào log chỗ lẽ ra đã nhảy.
jump_up=true

# "Tự tìm quái trong vùng" (since 2026.11.05b): with a hunting area drawn on
# the "Bản đồ" tab in use (spot=true), packet_positions=on and stay_put=false,
# go to any monster inside the area the character can get to -- in view or
# not -- walking along its floor, off a floor's end onto a floor inside the
# area, or by a jump up when jump_up may go, and fight it from a standing
# point inside the area: one in reach first, then those on your own floor,
# then below, then above. Never out of the area. With nothing inside it to get
# to, the character stands where it is (outside it, it walks back as before).
# On by default; false hunts as 2026.11.05 did. This run's spot (no area
# drawn), no spot, Watch and the monster lists are as before either way.
#
# Đi tới quái ở bất kỳ chỗ nào trong vùng vẽ ở tab "Bản đồ" mà nhân vật tới
# được (đi bộ, rơi xuống từ mép bục, nhảy lên), kể cả quái chưa thấy trên màn
# hình, rồi đứng trong vùng mà đánh; không bao giờ ra khỏi vùng. Trong vùng
# không còn con nào tới được thì đứng chờ tại chỗ. Bật sẵn; false thì đánh như
# bản 2026.11.05.
seek_in_zone=true

# Pick up what the monsters drop, with the game's pick-up key (a VK code; 0 =
# not set). Pressed a few times straight after each kill, and every
# loot_interval_ms while fighting. "Tự nhặt đồ" on the simple screen.
loot=false
loot_key=0
loot_interval_ms=2000

# Stand still: attack whatever comes within reach and never walk to anything.
# For a spot the monsters come to. "Đứng yên một chỗ" on the simple screen.
# With spot=true it still walks back to the spot when pushed off it.
stay_put=false

# "Chỗ đánh quái": hunt round one spot, and walk back to it when there is
# nothing to fight. The spot is where the character stands, on the ground, at
# the first moment the game's packets say where that is -- in their world
# pixels, which do not move with the view -- or where "Đặt chỗ này" is pressed.
# Only monsters inside the area round it are walked to; one within reach is
# fought wherever it stands. No hop toward a monster while this is on: a hop
# can leave the character on the platform above, and the walk back never
# presses Down (40); with drop_down=true, Ctrl + Down drops only where you
# stand, land and the target all lie inside the area. With no position to go
# by -- no capture, the packets lost the character -- the character stands and
# attacks only what comes within reach, as stay_put does; until the packets
# first report the character after the capture starts, it hunts as with this
# off. After a map change it stands until the character comes back through a
# door to near where it left; after a log in again ("Tự đăng nhập", or the
# game found again with "Tìm lại"), until the character stands, after its
# first step or skill, within 150 px of where it was or of the spot, on no map
# the packets know is another (a log in after a door keeps the door's rule);
# otherwise until "Đặt chỗ này" is pressed. One spot a run, taken afresh at
# each start, and dropped when this is switched off mid-run; nothing of it is
# saved. A map with a hunting area drawn on the "Bản đồ" tab -- a box and the
# home the bot walks back to, one per map in configs\spots.ini, which GoBot
# writes (never this file) -- is hunted in that area instead, once the
# character stands still inside it or within 150 px of it (until then round
# where it stands); "Đặt chỗ này" there moves the area to where the character
# stands, and saves it. In such an area, by the map's own file (since
# 2026.11.04d), no walk toward a monster leaves its box; more than 60 px
# outside it with a way back the file shows -- along the floor, or off a
# floor's end into the box -- monsters outside it are let be, in reach too,
# and the character walks back first, never hopping; with no way back and
# the home more than one jump up, it fights where it stands. Since
# 2026.11.05b, with jump_up and seek_in_zone (above), such an area also has
# planned jumps up -- to a monster's floor, and on the way back -- and with
# nothing inside it to get to, the character stands where it is. It moves the
# character, so it ships off. Needs Npcap:
# without it, or with packet_positions=off, fighting does not start while this
# is on. On the simple screen: the "Chỗ đánh quái" tick with "Đặt chỗ này"
# beside it, and the area and spot_tolerance in the "Tầm đánh…" window.
#   spot_half_w / spot_half_h  the area: this far either side of the spot
#                              (50-2000) and above and below it (20-500);
#                              also the size of a new area on "Bản đồ"
#   spot_tolerance             further than this along the ground, the
#                              character walks back (10-1000); at spot_half_w
#                              or more, only once pushed out of the area
#   spot_return_delay_ms       with nothing to fight this long first (0-60000)
#   spot_give_up_ms            a walk back the packets' reports put no 20 px
#                              nearer in this long is let go of (3000-60000)
#   spot_retry_ms              and tried again this much later (1000-600000);
#                              after 3 in a row, not until the spot is set
#                              again or the character is back at it
# A spot more than one jump above (120 px) is not walked back to; one below is
# walked toward, in case the platform ends and the character drops down. An
# area's home goes by its map's file instead, as above: walked back to along
# the floors, slopes up too, and off a floor's end into the box; one that
# no such way gets to is walked toward as here.
#
# Chỉ đánh quái trong một vùng quanh chỗ đánh quái, hết quái thì tự đi về
# chỗ. Chỗ là nơi nhân vật đang đứng lúc gói tin của game báo được vị trí
# (hoặc lúc bấm "Đặt chỗ này"). Quái trong tầm đánh thì vẫn đánh, dù ở ngoài
# vùng. Không nhảy lên theo quái; đi về chỗ thì không bao giờ bấm ↓ (có
# drop_down=true thì Ctrl + ↓ chỉ nhảy xuống tới quái, khi chỗ đứng, chỗ rơi
# và con quái đều trong vùng). Lúc mới bắt gói tin, chưa có báo vị trí nào
# thì bot đánh như thường; gói tin mất dấu nhân vật thì đứng yên, chỉ đánh
# quái tới trong tầm. Đổi bản đồ thì bot đứng yên tới khi nhân vật qua cửa
# quay về gần chỗ đã rời đi; vào lại game (Tự đăng nhập hay Tìm lại) thì
# đứng yên tới khi nhân vật đứng cách chỗ đánh quái, hoặc chỗ nó đứng trước
# khi vào lại, không quá 150 px (sau bước đi hay kỹ năng đầu tiên); không
# thì bấm "Đặt chỗ này". Mỗi lần bắt đầu lấy chỗ mới, không lưu lại. Bản đồ
# có vùng đánh vẽ ở tab "Bản đồ" (lưu trong configs\spots.ini, không phải
# file này) thì bot dùng vùng đó khi nhân vật đứng yên trong vùng hay cách
# vùng không quá 150 px; từ bản 2026.11.04d bot không đi tới quái theo đường
# ra khỏi vùng, và ở ngoài vùng quá 60 px mà có đường đi bộ về thì đi bộ về
# trước, không nhảy (không có đường về mà chỗ về cao hơn một lần nhảy thì
# đánh tại chỗ). Từ bản 2026.11.05b, có jump_up và seek_in_zone (ở trên),
# trong vùng đó bot còn nhảy lên bục của quái và trên đường về khi file bản đồ
# cho thấy chắc chắn, và trong vùng không còn quái tới được thì nhân vật đứng
# chờ tại chỗ. Cần Npcap: không có Npcap (hoặc packet_positions=off) thì
# Tự đánh quái không chạy khi ô này có dấu.
spot=false
spot_half_w=300
spot_half_h=100
spot_tolerance=48
spot_return_delay_ms=1500
spot_give_up_ms=4000
spot_retry_ms=30000

# "Giữ khoảng cách": step back from a monster nearer than min_distance (50 px
# with none set), as GoC's backing_away does, before attacking it. It moves
# the character, so it ships off. Never while standing still, never from a
# monster off the character's own level, and never more than
# keep_distance_steps steps one way (1-10), from whichever monsters, until the
# character has walked back the other way: GoBot cannot see where a platform
# ends. A step that meets a wall or goes down a ledge stops the steps that way
# until such a walk. The first step past an edge GoBot cannot see is not
# prevented.
keep_distance=false
keep_distance_steps=3

# How far to the side, in pixels, a monster may be before the character turns
# to it: GoC's "Hạn chế quay người".
facing_tolerance=12

# The monster lists: "Lọc quái" on the simple screen's Đánh quái tab. Names as
# the game writes them on the plates, separated by commas, at most 20 in each.
# Matched loosely, because they are read off the screen: accents, capitals and
# spaces do not count, and a name of five letters or more may have one letter
# in five wrong or missing. A name of four letters or fewer must match exactly.
#   skip_monsters   "Không đánh": never attacked.
#   first_monsters  "Đánh trước": gone for before any other on the same level,
#                   and taking over from another being fought once in reach.
#   first_only      attack only those on first_monsters, as GoC's "Loại mob".
# A name on both lists is not attacked. Empty lists change nothing.
skip_monsters=
first_monsters=
first_only=false

# Only send input while the game window has focus. Leave this on. With it off
# the arrow keys go to whatever window is in front.
require_focus=true

# Bring the game to the front when hunting is switched on. Clicking START
# HUNTING takes focus off the game, and with require_focus on the hunter will
# not send anything to an unfocused window -- so without this it starts and
# reports "waiting for the game to have focus" forever.
#
# Only on the way on. Keeping it in front during a run is a separate choice --
# refocus in [Simple] in app.ini, on by default -- which brings it back at once
# whenever another window takes it.
focus_on_start=true

# "Vị trí từ gói tin": where your position and the monsters' come from.
#   off    the screen only, as always; no capture is started for it, and
#          nothing at all is taken from the packets
#   watch  a capture of the game's own traffic runs all session, hunting or
#          not (from GoBot's start, unless stopped by hand), and while
#          hunting writes a "Positions" line to gobot_gui.log every 10 s,
#          comparing what the packets say with what the screen shows; the
#          screen still fights (what a file without this key gets)
#   on     the packets steer whenever they are healthy, the screen whenever
#          they are not: no Npcap, no game traffic, the character not moved
#          since the capture began, a map just changed, a monster list in use
# Needs Npcap; GoBot already runs as administrator.
#
# Vị trí nhân vật và quái lấy từ đâu ("Vị trí từ gói tin" ở thẻ Đánh quái).
#   off    chỉ đọc màn hình như cũ, không bắt gói tin
#   watch  bắt gói tin của game suốt phiên (từ lúc mở GoBot, có đánh quái
#          hay không); khi đánh quái cứ 10 giây ghi một dòng "Positions" vào
#          gobot_gui.log, so gói tin với màn hình; vẫn đánh theo màn hình
#          (mặc định)
#   on     đánh theo gói tin khi gói tin dùng được, không thì theo màn hình
# Cần Npcap.
packet_positions=watch

# How the packets' world pixels lie over the screen's, until a live hunt has
# measured it: packet_scale is world pixels per screen pixel (1 = one to one),
# packet_dy is added to each monster's height against you, in screen pixels.
# The "Positions" line prints what it measured next to both.
# Cách đặt gói tin lên màn hình: chỉ sửa khi được hỏi, theo dòng "Positions"
# trong log.
packet_scale=1
packet_dy=0

[Move]
# Walking to saved places, and patrolling between them.
#
# Positions are worked out by watching the scenery slide: between two frames
# the background shifts by exactly how far the view moved, and adding those up
# gives where the view is looking. That plus the character's place on screen is
# a position in the level rather than in the window.
#
# The origin is wherever tracking started, and it starts again at every map
# change and whenever watching starts again: places saved by it hold only until
# then. Nothing pins it to the level yet; lasting places are to come from the
# game's own coordinates in its packets.

left_key=37
right_key=39
# The game's jump, pressed to get up to a place above: the Up arrow (38), and
# what a file without this key gets too. In this game Space (32) is the
# attack, so a walk with Space here attacks instead of jumping -- what every
# file before this one said. The simple screen's "Trước khi bắt đầu" and the
# Radar tab say so when this is Space or the attack key; nothing changes a
# file of yours for it.
jump_key=38

# Close enough to count as arrived, in level pixels.
arrive_tolerance=40

# One walking step.
step_ms=180

# A wall, a gap and a ledge it cannot climb all look the same from here. After
# this long the leg is abandoned and the next one started.
leg_timeout_ms=20000

# Pause at each end of a patrol.
dwell_ms=800

require_focus=true

