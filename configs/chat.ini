# Tự chat: lines said in the game's chat, one at a time, on a timer.
#
# The simple screen's "Tự chat" tab writes this file as you change things; it
# can be edited by hand too, as UTF-8. A running Tự chat reads it again every
# second or so. No file at all means Tự chat is off.
#
# How a line is said, as GoC says it: Enter opens the chat line, a look at the
# screen checks that it is open, Backspace clears it, the line is typed one key
# per character, Enter sends it and another look checks the line closed. No key
# is pressed before the line is seen open, Enter only on a look that shows no
# dialog (Enter would answer it), and everything else that presses keys --
# fighting, potions, buffs, the trash cleaner -- waits while a line is typed.
# When GoBot cannot see the chat line shut afterwards, all of that keeps
# waiting until it can: a skill key in an open chat line is a letter in it.
#
# Where it goes: to whatever the button left of the game's chat box is set to,
# usually Thường. To speak in Đội or Môn Phái, choose that on the button in the
# game before pressing BẮT ĐẦU. GoBot never clicks it.

[Chat]
# On when BẮT ĐẦU is pressed. Off until ticked on the tab.
enabled=false
# Seconds from one line to the next, 30 to 3600. Less than 30 is taken as 30:
# more often than that is spam.
interval_s=120
# in_turn: line1, line2, ... and round again. random: any line but the one
# said last.
order=in_turn
# How far each interval may stray either way, in percent (0-30).
jitter_pct=15
# Seconds from BẮT ĐẦU to the first line.
first_delay_s=15
# Characters a line may have (1-120); a longer one is cut. The game's own limit
# has not been measured yet.
max_length=60
# With method=vk the marks always come off Vietnamese letters ("đồ" is typed
# "do"): it has no keys for them. The other methods keep them, to find out
# whether the game takes them, unless this is true.
strip_diacritics=false
# How the text goes into the open line:
#   vk       one key press per character, as GoC does: A-Z, a-z, 0-9 and space
#            only; everything else is left out.
#   unicode  SendInput's Unicode input, one character at a time.
#   wmchar   WM_CHAR posted to the game's window, one character at a time.
#   imechar  WM_IME_CHAR posted the same way.
# Only vk is the way GoC types. The others have not been tried on the live game:
# they are for the live test, to find out whether any gets Vietnamese through.
# Anything else is typed with vk. GoBot never touches the clipboard.
method=vk
# Backspaces pressed in the opened line before typing, for anything left in it.
clear_backspaces=6
# The chat bar's pictures under templates\ (GoC's own): the bar open, and its
# field while shut, and how alike the field has to be to the second (0.988 on
# every saved frame).
open_picture=inven/0/dialog_chat_res3.spr/0
closed_picture=inven/0/dialog_chat_res3.spr/1
closed_score=0.90
# How far from its left edge, in pixels, the open line shows something while
# it is empty: its caret. Enter sends whatever is in the line, so GoBot only
# closes a line with Enter while it shows no more than this, and types a line
# only once Backspace has the field showing no more than this (1-40). Not
# measured on the live game yet: gobot_cli --chatcheck with the line open and
# empty prints it as ink=. Too small, and lines fail with "Ô chat còn chữ không
# xoá được" while the line is empty.
empty_ink=12
# Lines that fail one after another before Tự chat stops itself.
max_failures=3
# What gobot_cli --chat-once types, for the live test. To try a method with
# Vietnamese, put a line with its marks here, such as: thử tiếng Việt
test_line=test

# How the keys of a line go. On 2026-10-20 the game took about half of the
# Enters and a third of the typed lines showed nothing. The log's "Chat trace"
# line, after each line GoBot tries, says how long each key was held and what
# the chat bar showed after it -- whether the game dropped a key or took it
# late. These are for trying that out without a new GoBot; as shipped each is
# what GoBot has always done.
# The hold of every key of a line -- Enter, Backspace, the letters -- in ms, a
# random one from hold_min_ms to hold_max_ms (10-500). Both 0: each key its
# own, as always (the Enter that opens the line 60-130, a letter 50,
# Backspace 25-70). GoC holds every key 60-131. Everything else of GoBot waits
# while a line is typed, the potions too: HP falling under the potion's mark
# ends the line at once, in any of the waits below as well -- but what was
# typed is rubbed out first, a key at a time at this hold.
hold_min_ms=0
hold_max_ms=0
# How long an Enter that opens the line is watched for it to open, a look
# every 250 ms, before another is pressed (250-3000).
enter_gap_ms=750
# Nothing pressed for this long, everything else held off, before the first
# Enter of a line (0-5000).
quiet_before_ms=300
# From the line seen cleared to its first letter (0-3000).
type_wait_ms=0
# Enters pressed to open the line before giving up on it (1-4). More only once
# the trace shows the game dropping Enters, not taking them late: a late one
# would shut the line the one before opened.
max_enters=2
# Times the line is typed into the open, empty line before "Game không nhận
# chữ" (1-2). The second only when every look at the first showed nothing, and
# never into a line that took any of it.
type_tries=1
# vk: each key with its key code, as GoBot always has. scancode: the scan code
# alone, as GoC sends keys.
inject=vk

[Lines]
# line1 to line10, said in this order (or at random). Empty ones are skipped.
# lineN_only_alone=true beside a line is the tick "Chỉ khi chưa có tổ đội" on the
# Tự chat tab: that line is not said while you are in a party -- GoBot looks at
# the party panels on the game's screen first -- and the next line goes instead.
