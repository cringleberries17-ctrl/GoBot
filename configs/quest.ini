# Làm nhiệm vụ nhanh: giống GoC với bản game tiếng Việt (VTC). Khi bot chạy, cứ
# vài phút GoBot mở cửa sổ Nhiệm Vụ, sang thẻ NV Phụ, bật ô "Tự Động" của game
# nếu nó đang tắt, rồi đóng cửa sổ lại. Ô đã bật sẵn thì không bấm vào.
#
# GoBot không tự nhận, trả, huỷ hay chọn nhiệm vụ nào. Nó không bao giờ bấm nút
# "Hủy Nhiệm Vụ", các nút nhận/bỏ/trả nhiệm vụ, ô "Nhiệm Vụ Công Lực Thấp Không
# Hoạt Động" ở góc trên bên phải, hay các thẻ khác. Không gõ chữ, không bấm
# Enter hay Esc.
#
# Khi bot chạy, mỗi lần làm theo giờ chỉ làm khi game đang ở trên cùng: GoBot
# không kéo game lên trước khi bạn đang dùng cửa sổ khác (nút "Làm ngay 1 lần"
# thì có). Máu xuống dưới mức uống bình HP giữa chừng thì GoBot dừng ngay để
# bình uống được; cửa sổ GoBot đã mở thì lần sau đóng.
#
# Thẻ "Nhiệm vụ" trên màn hình đơn giản ghi file này mỗi khi bạn đổi gì; sửa
# bằng tay cũng được (UTF-8). Không có file này thì làm nhiệm vụ nhanh tắt.
# GoBot đọc lại file trước mỗi lần làm, nên sửa xong không cần mở lại GoBot.
#
# Hình nhận diện là hình của GoC: templates\quest\1 (bản tiếng Việt). Hình
# templates\quest\0 (bản tiếng Anh) chỉ để nhận ra bản tiếng Anh — với bản đó
# GoBot không làm gì.

[Quest]
# Bật làm nhiệm vụ nhanh khi bấm BẮT ĐẦU.
enabled=false
# Mấy phút làm một lần (1-60), xê dịch thêm bớt một phần mười.
interval_min=5
# Lần đầu sau khi bấm BẮT ĐẦU chừng này giây (sau lần dọn rác và câu chat đầu).
first_delay_s=40
# Phím mở/đóng cửa sổ Nhiệm Vụ, theo mã phím Windows (VK): 85 là U, phím mặc
# định của GoC. Viết tên phím cũng được, ví dụ U hoặc Q. Không dùng Enter, Esc.
quest_key=85
# Hỏng chừng này lần liền thì tự tắt và báo (1-20).
max_failures=3
# Ô Tự Động đã bật sẵn 3 lần liền thì giãn ra: 10, 20, rồi 30 phút một lần.
# Lần nào thấy ô tắt thì về lại interval_min.
back_off=true
# Bản game: auto (tự nhận ra), vi (tiếng Việt) hoặc en (tiếng Anh: không làm).
skin=auto

[Layout]
# Vị trí tính từ góc trên bên trái cửa sổ Nhiệm Vụ, đo trên hình của GoC
# (x,y hoặc x,y,rộng,cao). Chỉ sửa khi game vẽ khác.
# Thanh tiêu đề: chừng này hàng trên cùng, bỏ bớt chừng này cột mỗi bên (góc bo).
window_title_rows=32
title_inset=10
# Hàng 4 thẻ: NV Chính, Đang Tiến Hành, Hoàn Thành, NV Phụ; thẻ này cách thẻ kia.
tabs_area=10,32,302,28
tab_pitch=76
# Chỗ bấm vào thẻ NV Phụ (điểm của GoC).
tab_click=274,47
# Vùng tìm ô Tự Động: 100 điểm ảnh dưới cùng, như GoC.
auto_area=0,360,672,100
# Tính từ góc ô Tự Động: chỗ bấm (của GoC) và cái ô vuông.
auto_click=11,15
auto_box=4,8,14,14
# Sau khi bấm, dời chuột sang phải chừng này điểm rồi mới xem lại ô.
hover_dx=14
# Không bao giờ bấm vào đây: nút "Hủy Nhiệm Vụ" và ô ẩn nhiệm vụ công lực thấp.
forbid_abandon=296,417,80,30
forbid_hide_low=523,37,14,14
# Cũng không bấm vào chỗ các nút nhận, bỏ và trả nhiệm vụ nhanh (vùng GoC đọc
# các nút đó, quanh nút "Hủy Nhiệm Vụ").
forbid_buttons=283,412,103,41

[Pictures]
# Tên hình trong thư mục templates (không có .png).
window=quest/1/Dlg_Quest_Neo
window_en=quest/0/Dlg_Quest_Neo
auto=quest/1/radio_LetterQuest_Auto.spr/0
on=quest/1/btn_QuestNeo_Radio.spr/0
off=quest/1/btn_QuestNeo_Radio.spr/1
# Hình 4 thẻ, cạnh hình cửa sổ; mỗi thẻ có hai kiểu vẽ, /0 và /1.
tabs=btn_NewQuestDlg_QuestList.spr,btn_NewQuestDlg_ProcessingQuest.spr,Btn_NewQuestDlg_CompleteQuest.spr,btn_NewQuestDlg_LetterQuest.spr

[Scores]
# Giống hình bao nhiêu thì nhận (0.60-0.99).
# Thanh tiêu đề cửa sổ.
window=0.85
# Từng thẻ trong hàng thẻ, ở kiểu vẽ giống hơn.
tabs=0.85
# Ô Tự Động.
auto=0.80
# Cái ô vuông: giống hình "đã bật" hay "chưa bật" từ chừng này, và hơn hình kia
# ít nhất state_margin. Không rõ thì không bấm.
state=0.80
state_margin=0.10

[Timing]
# Mili giây, theo GoC.
# Giữ phím khi mở và khi đóng cửa sổ.
open_hold_ms=50
close_hold_ms=100
# Chờ sau khi bấm phím, rồi tìm cửa sổ mỗi 250 ms trong chừng này.
open_wait_ms=500
open_look_ms=1500
# Chờ sau khi bấm thẻ NV Phụ, sau khi bấm ô, sau khi dời chuột.
tab_wait_ms=500
click_wait_ms=300
hover_wait_ms=200
# Chờ cửa sổ đóng sau khi bấm phím đóng.
close_wait_ms=1000
# Một lần làm không bấm gì nữa sau chừng này (3000-30000).
round_limit_ms=10000
