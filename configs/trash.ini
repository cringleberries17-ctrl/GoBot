# GoBot trash cleaning ("Dọn rác")
#
# Every so often GoBot opens the bag, goes through the tabs ticked below, and
# puts into the trash can anything that is one of the pictures in
# configs\trash\delete\ or one of the icons chosen in [Items]. Then it closes
# the bag again. Fighting, potions and buffs wait while it does.
#
# Nothing is dropped on the ground, whatever is in configs\trash\drop\: GoBot
# has no picture of the game's drop question with its words, and it answers no
# dialog it cannot tell from the others.
#
# Fragments on the "Dùng" list -- [Items] use=, chosen on the tab, or pictures
# in configs\trash\use\ -- are registered in Yêu Quái Bách Khoa instead, before
# anything on Tiêu Dùng is deleted: a right-click on the piece, then Xác Nhận on
# the game's registration question, and only on that question, by its words.
# That cannot be undone either. GoBot does it only with use_fragments=true
# below, which ships off, and with its picture of the question taken from the
# live game (grabbed/fragment_register); otherwise it only says where they are.
# The right-click opens Yêu Quái Bách Khoa as well, and it stays open after the
# question: GoBot closes it with its X, and sees it closed, before the next
# piece, or stops there. Only fragments and charms are ever right-clicked: a
# picture of anything else in configs\trash\use\ is said, never used. An icon on both
# lists is registered first, and what is left of that one stack deleted in the
# same pass, from the very slot it was registered from, once the slot shows one
# piece less. A fragment's icon only says which of a monster's nine pieces it
# is, so another slot drawn the same is most likely another monster's piece: it
# is not deleted until it has been registered itself, one slot of each drawing
# a pass. Charms (Bùa) on the same list are used on their own, see use_charms
# below. A slot that something on the "Dùng" list matches is never deleted
# whole, even where a picture in configs\trash\delete\ looks more like it -- one
# cut before the piece was chosen to use, say: it is registered, or left as it
# is, and Thử tìm says which picture gave way.
#
# The pictures are cut from your own bag on the simple screen's "Dọn rác" tab.
# Deleting cannot be undone, so add only what you are sure of, and try "Thử tìm"
# first: it goes through the bag and says what it would throw away, without
# throwing anything.
#
# Items are matched by their drawing, not their colour: the fragments in the
# bag change colour all the time, gold to orange to red and back. So an icon
# chosen in [Items] also takes the same drawing in other colours, and the tab
# shows which before anything is deleted. A slot that looks as much like an
# icon that was not chosen, and is drawn differently, is left alone, and Thử
# tìm says so.

[Trash]
# Run by itself while the bot runs. The simple screen's "Tự dọn rác".
enabled=false
interval_minutes=10

# The game's key for the bag (a VK code; 73 = I).
bag_key=73

# Which tabs to go through.
tab_equip1=true
tab_equip2=true
tab_use=true
tab_other=true
tab_pet=false

# How alike a slot's drawing has to be to a picture's, 0.85 to 0.99, colour
# left out. High on purpose: a near miss here deletes something that was not on
# the list. Measured on real bags, a picture scores 0.93 or more on its item in
# another colour, and 0.81 at most on anything else. Not the only guard: the
# plain and the decorated gourd potions score up to 0.92 on each other, and are
# kept apart by the rest of the catalog, not by this. catalog_score is the same
# for the icons in [Items]: 0.90 unless set here.
min_score=0.90

# At most this many items in one pass.
max_per_run=40

# Register the fragments on the "Dùng" list: true or false. "Dùng mảnh ghép"
# on the simple screen's "Dọn rác" tab. Off, a pass only says where they are,
# as Thử tìm does, and right-clicks nothing. A registration cannot be undone,
# so it ships off, and a file without this line is off too.
use_fragments=false

# At most this many fragments registered ("Dùng") in one pass, 1 to 100.
max_uses_per_run=20

# Use the charms (Bùa) on the "Dùng" list: true or false. "Dùng bùa" on the
# simple screen's "Dọn rác" tab. A charm is used by a right-click on it in
# Tiêu Dùng and Xác Nhận on the question the game asks. GoBot has no picture of
# that question yet: it presses Xác Nhận on a box with the same frame and
# buttons as the registration question's (charm_frame_score below) whose words
# are not those of the bin's, the revive question or selling. The drop question
# has no words in its picture, so it is told only by its frame, not by words.
# The charm run also needs no window of the game's open beside the bag, the
# stack read in the game's digits, and counts a charm as used only when the
# stack is seen one less -- anything else after Xác Nhận counts as perhaps
# used. It lasts an hour and costs one, so each kind is used once and not again
# until charm_every_minutes are over, written in
# %LOCALAPPDATA%\GoBot\charm_clock.txt -- before the right-click, so that
# starting GoBot again does not use another. Charms are used by a run of their
# own, quick (a few seconds, 20 at the most), in which nothing else of GoBot
# presses a key -- not skills, potions or buffs -- and never inside the slow
# pass that clears the bag: a pass only says where it sees one. Not while HP is
# near the HP potion's mark. Ships off; a file without this line is off too.
use_charms=false

# How much of the registration question's box -- the frame under its words,
# with the buttons -- a dialog must show to be taken for a charm's question:
# 0.85 to 0.99. The questions GoBot knows score 0.89 at the most against it,
# and the game's own box in that frame near 1, so 0.92 keeps the others out.
# Lower it only after looking at the frames the run keeps in trash_debug
# (charm_question): a charm that is never used is this too high.
charm_frame_score=0.92

# Buy Thịt bò khô (HP) and Rượu lá tre (MP) from the shop the Người Giữ Sân
# item of the bag's Khác tab opens: true or false. "Tự mua bình" on the simple
# screen's "Dọn rác" tab. Every buy_every_minutes GoBot opens the bag, counts
# the slots of each potion in Tiêu Dùng and, for a potion with fewer slots than
# its buy_*_below, right-clicks the item, double-clicks the potion, types
# 100 into the quantity box -- the game's 1 is in it, so 00 -- reads the number
# back, and only then presses Xác Nhận; until the slots reach buy_*_to, a
# purchase at a time, then ESC for the shop. Anything unexpected is answered
# Hủy Bỏ and the run stops with a picture kept in trash_debug. While it runs
# nothing else of GoBot presses a key -- skills, potions and buffs wait, which
# can be a few dozen seconds -- and it does not run with HP near the HP
# potion's mark (never counted over 95%). It spends the character's money
# and types numbers into a game box, so it ships off; a file without this
# line is off too. The first round buys ONE of each potion wanted, the slots
# are counted and what grew has to be that potion before the rest is bought;
# a purchase that adds no slot stops it, and it is not run by the clock again
# until "Mua ngay" or the switch ticked again. At most 40 purchases, 4 rounds
# and 240 seconds a run. The tab's "Thử mua" goes as far as the quantity box
# and answers Hủy Bỏ: nothing typed, nothing bought.
buy_potions=false

# How often the bag is looked at: 5 to 1440 minutes. The first look is soon
# after the bot starts.
buy_every_minutes=60

# Slots of each potion in Tiêu Dùng: under *_below of them more are bought, up
# to *_to. *_below=0 leaves that potion alone. 0 to 60; *_to is never under
# *_below. One purchase of 100 is expected to fill one slot (not yet seen on
# the live game), and the slots are counted again afterwards: a purchase that
# adds no slot is not repeated.
buy_hp_below=3
buy_hp_to=6
buy_mp_below=3
buy_mp_to=6

# The catalog id of the Người Giữ Sân item (the portrait the other helper names,
# other/8950604). Change only if the item in your bag is drawn otherwise.
buy_opener=other/8950604

# How much of the sell question's box the shop's quantity box must show to be
# taken for one of the game's own: 0.70 to 0.99. There is no picture of the
# buy question itself. Lower it only after looking at the frames the run keeps
# in trash_debug (shop_question); a box that is never found is this too high.
buy_frame_score=0.85

# How long a charm lasts, and so how soon after one is used another of the same
# kind may be: 5 to 1440 minutes. A charm used with no sign of whether it took
# waits as long, for a charm used twice is lost; one that was not used is tried
# again in 10 minutes.
charm_every_minutes=60

# How long a right-click on a charm is watched for the game's question, or for
# the stack to change, before giving up on it: 300 to 3000 milliseconds.
charm_wait_ms=1000

# false: drag the item onto the trash bin. true: click it, then click the bin
# -- for a game set up to move items that way. Either way the bin is clicked
# afterwards, which is what brings up the confirmation.
click_to_move=false

# How fast GoBot presses in its bag jobs (Dọn rác, Dùng bùa, Tự mua bình): the
# gap after each key typed into the shop's box, and the pauses of its clicks
# and drags, in milliseconds: 60, 80, 100 or 150 (60 to 150). 80 is how it has
# always pressed. "Tốc độ bấm nút" on the simple screen's "Dọn rác" tab. The
# waits for the game to answer and the read-backs do not change with it.
press_ms=80

[Bag]
# Where things are in the bag window, in pixels from the top-left of the strip
# of tabs (Trang Bị 1, Trang Bị 2, Tiêu Dùng, Khác, Linh Thú). Measured off the
# commercial client's own picture of the window; only worth changing for a
# different skin.
tab_w=37
cell=34
pitch=37
grid_dx=1
grid_dy=25
cols=6
rows=4
scroll_up_dx=236
scroll_up_dy=32
scroll_down_dx=236
scroll_down_dy=163

# The scroll bar's track between the arrows, first and last row. Where its
# white thumb sits says which row of the tab is on top and how many rows the
# tab has, measured on the live client.
track_top_dy=39
track_bottom_dy=155

# The trash bin: the square in the bottom-right corner, to the can it shows
# when empty. Deleting is: drag the item onto it, click it, Xác Nhận.
bin_dx=228
bin_dy=178
bin_w=16
bin_h=22

# The corner of a slot with the stack count in it, and the edge where the
# highlight goes. Neither is compared, so a stack of 67 and a stack of 3 are
# the same item.
count_w=18
count_h=11
edge=2

# The bottom-right corner of a slot, where the game draws a badge (a green ring
# with a red P) over some items. Not compared either, so an item with a badge
# is still the item: measured on the live client, the badge is 11 by 11.
badge_w=12
badge_h=12
