# GoBot trash cleaning ("Dọn rác")
#
# Every so often GoBot opens the bag, goes through the tabs ticked below, and
# gets rid of anything that looks like one of the pictures in configs\trash\:
# into the trash can for those in configs\trash\delete\, onto the ground for
# those in configs\trash\drop\. Then it closes the bag again. Fighting, potions
# and buffs wait while it does.
#
# The pictures are cut from your own bag on the simple screen's "Dọn rác" tab.
# Deleting cannot be undone, so add only what you are sure of, and try "Thử tìm"
# first: it goes through the bag and says what it would throw away, without
# throwing anything.

[Trash]
# Run by itself while the bot runs. The simple screen's "Tự dọn rác".
enabled=false
interval_minutes=10

# The game's key for the bag (a VK code; 73 = I).
bag_key=73

# Which tabs to go through.
tab_equip1=true
tab_equip2=true
tab_use=true
tab_other=true
tab_pet=false

# How alike a slot has to be to a picture, 0.70 to 0.99. High on purpose: a
# near miss here deletes something that was not on the list.
min_score=0.90

# At most this many items in one pass.
max_per_run=40

# false: drag the item onto the trash bin. true: click it, then click the bin
# -- for a game set up to move items that way. Either way the bin is clicked
# afterwards, which is what brings up the confirmation.
click_to_move=false

[Bag]
# Where things are in the bag window, in pixels from the top-left of the strip
# of tabs (Trang Bị 1, Trang Bị 2, Tiêu Dùng, Khác, Linh Thú). Measured off the
# commercial client's own picture of the window; only worth changing for a
# different skin.
tab_w=37
cell=34
pitch=37
grid_dx=1
grid_dy=25
cols=6
rows=4
scroll_up_dx=236
scroll_up_dy=32
scroll_down_dx=236
scroll_down_dy=163

# The trash bin: the square in the bottom-right corner, to the can it shows
# when empty. Deleting is: drag the item onto it, click it, Xác Nhận.
bin_dx=228
bin_dy=178
bin_w=16
bin_h=22

# The corner of a slot with the stack count in it, and the edge where the
# highlight goes. Neither is compared, so a stack of 67 and a stack of 3 are
# the same item.
count_w=18
count_h=11
edge=2
