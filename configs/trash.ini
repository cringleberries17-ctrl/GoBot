# GoBot trash cleaning ("Dọn rác")
#
# Every so often GoBot opens the bag, goes through the tabs ticked below, and
# puts into the trash can anything that is one of the pictures in
# configs\trash\delete\ or one of the icons chosen in [Items]. Then it closes
# the bag again. Fighting, potions and buffs wait while it does.
#
# Nothing is dropped on the ground, whatever is in configs\trash\drop\: GoBot
# has no picture of the game's drop question with its words, and it answers no
# dialog it cannot tell from the others.
#
# The pictures are cut from your own bag on the simple screen's "Dọn rác" tab.
# Deleting cannot be undone, so add only what you are sure of, and try "Thử tìm"
# first: it goes through the bag and says what it would throw away, without
# throwing anything. A slot that looks like a chosen item but is another
# colour, or looks as much like something in the game's icons that was not
# chosen, is left alone, and Thử tìm says so.

[Trash]
# Run by itself while the bot runs. The simple screen's "Tự dọn rác".
enabled=false
interval_minutes=10

# The game's key for the bag (a VK code; 73 = I).
bag_key=73

# Which tabs to go through.
tab_equip1=true
tab_equip2=true
tab_use=true
tab_other=true
tab_pet=false

# How alike a slot has to be to a picture, 0.70 to 0.99. High on purpose: a
# near miss here deletes something that was not on the list.
min_score=0.90

# Fragments (Mảnh ghép) change colour all the time in the bag, gold to orange to
# red and back, so they are seldom the colour of their icon. true: a chosen
# fragment only has to be roughly the right colour. false: it has to be the
# right colour, like everything else. A set of pieces that is another colour
# altogether is left alone either way.
fragments_loose=false

# At most this many items in one pass.
max_per_run=40

# false: drag the item onto the trash bin. true: click it, then click the bin
# -- for a game set up to move items that way. Either way the bin is clicked
# afterwards, which is what brings up the confirmation.
click_to_move=false

[Bag]
# Where things are in the bag window, in pixels from the top-left of the strip
# of tabs (Trang Bị 1, Trang Bị 2, Tiêu Dùng, Khác, Linh Thú). Measured off the
# commercial client's own picture of the window; only worth changing for a
# different skin.
tab_w=37
cell=34
pitch=37
grid_dx=1
grid_dy=25
cols=6
rows=4
scroll_up_dx=236
scroll_up_dy=32
scroll_down_dx=236
scroll_down_dy=163

# The scroll bar's track between the arrows, first and last row. Where its
# white thumb sits says which row of the tab is on top and how many rows the
# tab has, measured on the live client.
track_top_dy=39
track_bottom_dy=155

# The trash bin: the square in the bottom-right corner, to the can it shows
# when empty. Deleting is: drag the item onto it, click it, Xác Nhận.
bin_dx=228
bin_dy=178
bin_w=16
bin_h=22

# The corner of a slot with the stack count in it, and the edge where the
# highlight goes. Neither is compared, so a stack of 67 and a stack of 3 are
# the same item.
count_w=18
count_h=11
edge=2
