# GoBot keyboard macro
#
# Two independent mechanisms, usable together:
#
#   [Keys]      each key on its own repeating timer
#   [Sequence]  an ordered combo, key then pause then next
#
# Everything here is editable in the GUI's Macro tab; this file is just where
# it is kept.
#
# It ships with every key and the sequence switched off, so that a first
# start presses nothing. The keys are filled in: ticking a row on the simple
# screen is what turns one on.

[Macro]
timers_enabled=true
sequence_enabled=false
sequence_loop=true

# Only send input while the target window has focus. Leave this on. With it
# off, keys go to whatever window happens to be in front -- which will
# eventually be a browser, a chat client, or a document.
require_focus=true

# Bring the game to the front when the macro is switched on. Clicking START
# MACRO necessarily takes focus away from the game, and keys only ever go to a
# focused window -- so without this the macro starts and immediately sits there
# holding, which looks like it not working.
#
# Only on the way on. Keeping it in front during a run is refocus in [Simple]
# in app.ini, on by default: it brings the game back at once whenever another
# window takes it.
focus_on_start=true

# Added on top of each key's own jitter. Perfectly regular key timing is the
# clearest signal that a client is automated.
global_jitter_pct=0

# Win32 virtual-key codes. 121 = F10, 123 = F12.
# The panic key stops everything and releases every held key.
toggle_key=121
panic_key=123

# Skills that follow the fight: "Chỉ khi đang đánh quái" on the simple screen,
# and its "Kỹ năng" window. On, with the hunter running, the skill keys -- all
# but those with always_timer -- and the [Sequence] steps go only while it is
# attacking a monster in reach and facing it, never with MP under
# skill_mp_floor_pct, never with the character down, and each only when the
# monster is within its range_px. Off, or with no hunter running, every key
# keeps its own timer, as it always has. It ships off: it changes how an
# existing setup fights.
# Since 2026.11.12 (the owner's "GoBot giữ skill lúc nguy hiểm"), with the
# hunter running, on or off, the skill keys -- always_timer and the
# [Sequence] steps too, never potions or buffs -- are held while a turn waits
# for the game's report of it, through a drop's settle and fall, with the
# hunting spot in use and nothing to fight in its area, and more than 60 px
# outside it with no walk back (and, as since 2026.11.10, while it walks
# back); and the dash's key -- learned from your moves with no walk, C, V and
# Space until then; since 2026.11.17 no key until one is learned -- wherever
# its landing would leave the area or run past a floor's end. The minute's
# "Skills:" line counts them.
# (VI) Từ bản 2026.11.12, khi Tự đánh quái chạy, phím kỹ năng (cả "Luôn bấm
# theo giờ"; không phải bình, buff) chờ lúc quay mặt, lúc nhảy xuống, lúc
# trong vùng không có quái và lúc ở ngoài vùng; phím lướt chờ ở gần mép.
#   sequential_skills   GoC's "Dùng skill tuần tự": every skill whose cooldown
#                       is over goes, in key order, skill_gap_ms apart
#                       (30-1000); off, only the first of them, a chance
#                       every 300 ms
#   skill_mp_floor_pct  no skill under this much MP (0-50; 0 = never held)
skills_follow_fight=false
sequential_skills=true
skill_mp_floor_pct=10
skill_gap_ms=50

# Skills paced by your own casts in the packets (2026.11.08): the tick "Ra
# chiêu theo vòng" on the "Tự dùng kỹ năng" row, "Ra chiêu theo vòng (chờ game
# ra chiêu rồi mới bấm chiêu kế)" in the "Kỹ năng" window (Chi tiết… on that
# row), and in the full screen's Timed keys -- one switch. On: one round in
# the order of the keys, each skill once, the next key pressed only after the
# game has cast the one before -- your client's cast frame seen -- and its
# lock is over. A key's interval_ms is then only the least time between two of
# its casts: a key not due passes its turn, and no key is starved. A key the
# game does not cast twice running is skipped that round, and its cooldown
# learned once that happens twice in a minute. With no cast of yours for 2 s
# while keys go out (out of the world, a town, the packets off), every key
# goes on its own timer until the next cast. Since 2026.11.17: a learned
# cooldown is never longer than the shortest gap the skill was ever cast
# again after, nor 12 s, and is checked after 3 turns; with the packets still
# coming (the character down or stunned) the round stays and tries one key a
# second, and with the packets gone too the timers press the skills at least
# a cast's lock apart; HP under 0.5% holds the skill keys. Potions go first,
# as ever. Buffs
# keep their own timers, but one due while a skill's cast is waited for, or
# inside its lock, goes once that lock is over (usually under a second), and
# the next skill waits for the buff's cast. Only the key sequence on, with a
# key in it, keeps it off.
# Since 2026.11.16b it runs while Tự đánh quái hunts too, the skills following
# the fight or not: its holds (walking back, turning, a drop, nothing to fight,
# outside the area, MP under the floor...) keep the round at its key; a key
# whose monster is out of its reach, or the dash key near an edge, only passes
# its turn and the round goes on with the next key. The hunter's attack key,
# when it is a skill here too, goes in its turn -- the hunter does not press
# it on top. And it is on by default:
# cast_paced_v2 is the switch read since 2026.11.16b; a file without it was
# written before and is read as on, whatever its cast_paced says (that false
# was the old default). cast_paced is still written, the same, for an older
# GoBot. To switch it off by hand: cast_paced_v2=false, with GoBot closed.
# (VI) Bấm kỹ năng theo nhịp chiêu ra: lần lượt từng chiêu theo thứ tự phím,
# chỉ bấm chiêu sau khi game đã ra chiêu trước (xem qua gói tin), cả khi Tự
# đánh quái chạy. Mặc định bật từ bản 2026.11.16b; muốn tắt thì bỏ dấu ô "Ra
# chiêu theo vòng" ở dòng Tự dùng kỹ năng.
cast_paced=true
cast_paced_v2=true

# Keys the game does not take. The game reads its keyboard once a frame, so a
# key held for less than a frame is lost now and then -- the key goes down and
# up and nothing happens -- and more so the more keys the macro presses.
#   key_hold_min_ms / key_hold_max_ms
#       how long each key is held, a random time between the two, for a key
#       with no hold_ms of its own (20-500). 0 and 0: the short 25-60 ms of
#       earlier versions. A file without them gets 70 and 110.
#   potion_recheck_ms
#       a potion whose bar has not risen this long after its press (500-3000),
#       while it still wants to drink, is pressed again at once rather than
#       after its interval_ms: the game may have ignored the press. Once per
#       press; the log says "Potion check: ..." each time. 0: never. A file
#       without it gets 1000. Since 2026.11.17, 3 presses in a row with no
#       rise (HP not falling further either) stop it, and potion_urgent_ms
#       below, until the reading rises: a misread bar no longer drinks once a
#       second.
key_hold_min_ms=70
key_hold_max_ms=110
potion_recheck_ms=1000

# A potion whose bar is under HALF its mark (a 59% MP potion: under 29%) may
# drink again potion_urgent_ms after its last press, not after its whole
# interval_ms: skills that drain MP faster than one potion per 3 s makes up
# left the bot behind. Between the mark and half of it the interval stands.
# 500-5000; 0 = never sooner. A file without it gets 1000.
potion_urgent_ms=1000

# The pet's potions pressed over and over while the pet is under its mark,
# as GoC presses the pet's food every 200 ms: every pet_hp_below key, Lv1 and
# Lv2 alike, goes again this many ms after its last press -- in place of its
# own interval_ms. "Bơm liên tục, mỗi N ms" on the pet's row of the simple
# screen (2026.11.10). 200-3000; 0 = each key's own interval_ms, as before.
# A file without it gets 300, and so does a missing macro.ini. A skill due is
# not starved: after a press of the pet's, a skill ready goes next, so the pet
# takes at most every other press; HP's and MP's potions still go first. The
# log's "Pet heals:" line says once a minute how many presses went out and how
# many the bar rose on.
# (VI) Bơm máu pet liên tục: mỗi N ms một lần khi máu pet dưới mức (200-3000).
pet_every_ms=300

# A buff is cast by pressing its key several times, as GoC does: 4 times, 200
# ms apart. The game drops a single press now and then, and a buff it dropped
# is gone for its whole interval -- a minute or five -- which looks like the
# buffs working sometimes. buff_presses 1 is the single press (1-6);
# buff_press_gap_ms 100-500. A file without them gets 4 and 200. The log says
# "Buff: key ... cast" at each cast, and why when one cannot be. Since
# 2026.11.17, with "Ra chiêu theo vòng" pacing, the buff's cast seen ends the
# rest of its presses: buff_presses is the most, for presses the game drops.
buff_presses=4
buff_press_gap_ms=200

[Keys]
# interval_ms   how often to press
# hold_ms       this key's own hold, in ms, at most 500 (more is read as
#               500): no key of the game is held down, every one is a press.
#               0 = the usual press, key_hold_min_ms to key_hold_max_ms
# start_delay_ms  initial offset, so timers do not all come due together
# jitter_pct    +/- randomisation applied to the interval each time
#
# trigger       always | hp_below | mp_below | pet_hp_below
# threshold_pct the percentage hp_below / mp_below / pet_hp_below compares
#               against
#
# pet_hp_below is the pet's HP: the red bar in the pet's slot on the HUD,
# under the HP and MP bars ("Tự bơm máu pet" on the simple screen). GoBot
# finds that bar by itself, so it has no place in [Vitals]; with no pet out,
# such a key holds, as any triggered key with no reading does. Its cooldown is
# [Macro] pet_every_ms, not its interval_ms, unless that is 0.
#
# With a trigger set, interval_ms becomes the cooldown -- the shortest gap
# between two firings -- rather than the rate. The key is tested several times
# a second regardless, so the reaction is immediate.
#
# A triggered key with no HP/MP reading available holds rather than firing. The
# Macro tab says so when that happens; set the bars up on the HP / MP tab.
#
# With skills following the fight ([Macro] skills_follow_fight):
# always_timer  this skill keeps its own timer anyway, fight or no fight --
#               "Luôn bấm theo giờ", for a skill that is a buff on yourself
# range_px      how far to the side the monster may be for this skill to
#               reach it; 0 = any distance (GoC's aoe_max_x). Since
#               2026.11.12 it counts on the key's own timer too -- always_timer,
#               or skills_follow_fight off -- while the hunter fights a monster
#
# buff          true: a buff ("Tự buff" on the simple screen) whatever its
#               interval_ms -- cast on its own clock, fight or no fight, and
#               again after a death, a revive or logging back in. 0 is as
#               often as a buff may go: every 5 s, as GoC casts a buff whose
#               cooldown is 0; nothing under 5 s is any sooner. false, or
#               missing: a key on a timer of a minute or more is a buff, and a
#               shorter one a skill.
#
# keycode is a Win32 virtual-key code: 65-90 the letters (90 = Z), 32 Space,
# 48-57 the digits (49 = 1). While Dọn rác deletes and Tự mua bình buys, only
# the keys on a letter or Space go on between GoBot's own clicks (2026.11.10),
# and since 2026.11.11 those on PgUp 33, PgDn 34, End 35, Home 36, Insert 45
# and Delete 46 too; a key on a digit, the number pad or an F-key waits for
# the job's end. Since 2026.11.21 a timed job gives way for an HP potion due
# on one, so that it drinks, and goes on a little later. key_6 and key_7, the
# HP and MP potions below, ship on 49 and 50 (1 and 2), as the simple screen
# fills them in: move them to a letter or one of the six to have them pressed
# during those jobs.
# (VI) Trong lúc dọn rác và mua bình chỉ phím chữ cái, Space, Home, End, PgUp,
# PgDn, Insert, Delete được bấm; phím số chờ xong việc. Bình HP, MP ở phím 1, 2
# thì đổi sang phím chữ cái hay một trong sáu phím đó.

key_0_label=Skill 1
key_0_keycode=90
key_0_enabled=false
key_0_interval_ms=1200
key_0_hold_ms=0
key_0_start_delay_ms=0
key_0_jitter_pct=10
key_0_always_timer=false
key_0_range_px=0

key_1_label=Skill 2
key_1_keycode=88
key_1_enabled=false
key_1_interval_ms=3000
key_1_hold_ms=0
key_1_start_delay_ms=150
key_1_jitter_pct=10
key_1_always_timer=false
key_1_range_px=0

key_2_label=Skill 3
key_2_keycode=67
key_2_enabled=false
key_2_interval_ms=6000
key_2_hold_ms=0
key_2_start_delay_ms=300
key_2_jitter_pct=10
key_2_always_timer=false
key_2_range_px=0

key_3_label=Skill 4
key_3_keycode=86
key_3_enabled=false
key_3_interval_ms=9000
key_3_hold_ms=0
key_3_start_delay_ms=450
key_3_jitter_pct=10
key_3_always_timer=false
key_3_range_px=0

key_4_label=Buff 1
key_4_keycode=51
key_4_enabled=false
key_4_interval_ms=300000
key_4_hold_ms=0
key_4_start_delay_ms=600
key_4_jitter_pct=5
