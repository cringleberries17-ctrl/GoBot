# GoBot keyboard macro
#
# Two independent mechanisms, usable together:
#
#   [Keys]      each key on its own repeating timer
#   [Sequence]  an ordered combo, key then pause then next
#
# Everything here is editable in the GUI's Macro tab; this file is just where
# it is kept.

[Macro]
timers_enabled=true
sequence_enabled=true
sequence_loop=true

# Only send input while the target window has focus. Leave this on. With it
# off, keys go to whatever window happens to be in front -- which will
# eventually be a browser, a chat client, or a document.
require_focus=true

# Bring the game to the front when the macro is switched on. Clicking START
# MACRO necessarily takes focus away from the game, and keys only ever go to a
# focused window -- so without this the macro starts and immediately sits there
# holding, which looks like it not working.
#
# Only on the way on. Pulling focus back whenever attention wandered would mean
# fighting you for your own desktop.
focus_on_start=true

# Added on top of each key's own jitter. Perfectly regular key timing is the
# clearest signal that a client is automated.
global_jitter_pct=0

# Win32 virtual-key codes. 121 = F10, 123 = F12.
# The panic key stops everything and releases every held key.
toggle_key=121
panic_key=123

[Keys]
# interval_ms   how often to press
# hold_ms       how long to hold it down (0 = a short randomised tap)
# start_delay_ms  initial offset, so timers do not all come due together
# jitter_pct    +/- randomisation applied to the interval each time
# drop_if_busy  skip rather than queue when another key is mid-press;
#               queueing produces bursts, which are useless and conspicuous
#
# trigger       always | hp_below | mp_below
# threshold_pct the percentage hp_below / mp_below compares against
#
# With a trigger set, interval_ms becomes the cooldown -- the shortest gap
# between two firings -- rather than the rate. The key is tested several times
# a second regardless, so the reaction is immediate.
#
# A triggered key with no HP/MP reading available holds rather than firing. The
# Macro tab says so when that happens; set the bars up on the HP / MP tab.

key_0_label=Skill 1
key_0_keycode=90
key_0_enabled=true
key_0_interval_ms=1200
key_0_hold_ms=0
key_0_start_delay_ms=0
key_0_jitter_pct=10
key_0_drop_if_busy=true

key_1_label=Skill 2
key_1_keycode=88
key_1_enabled=true
key_1_interval_ms=3000
key_1_hold_ms=0
key_1_start_delay_ms=150
key_1_jitter_pct=10
key_1_drop_if_busy=true

key_2_label=Skill 3
key_2_keycode=67
key_2_enabled=true
key_2_interval_ms=6000
key_2_hold_ms=0
key_2_start_delay_ms=300
key_2_jitter_pct=10
key_2_drop_if_busy=true

key_3_label=Skill 4
key_3_keycode=86
key_3_enabled=true
key_3_interval_ms=9000
key_3_hold_ms=0
key_3_start_delay_ms=450
key_3_jitter_pct=10
key_3_drop_if_busy=true

key_4_label=Buff 1
key_4_keycode=51
key_4_enabled=true
key_4_interval_ms=300000
key_4_hold_ms=0
key_4_start_delay_ms=600
key_4_jitter_pct=5
key_4_drop_if_busy=true

key_5_label=Buff 2
key_5_keycode=52
key_5_enabled=true
key_5_interval_ms=300000
key_5_hold_ms=0
key_5_start_delay_ms=750
key_5_jitter_pct=5
key_5_drop_if_busy=true

key_6_label=HP potion
key_6_keycode=49
key_6_enabled=true
key_6_interval_ms=3000
key_6_hold_ms=0
key_6_start_delay_ms=900
key_6_jitter_pct=15
key_6_drop_if_busy=true
key_6_trigger=hp_below
