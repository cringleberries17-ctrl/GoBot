[Sequence]
# Runs only when sequence_enabled is true. keycode 0 makes a step a pure pause.
# hold_ms as in [Keys]: 0 is the usual press, at most 500.
step_0_label=Skill 1
step_0_keycode=90
step_0_hold_ms=0
step_0_delay_after_ms=250

step_1_label=Skill 2
step_1_keycode=88
step_1_hold_ms=0
step_1_delay_after_ms=400

step_2_label=Skill 3
