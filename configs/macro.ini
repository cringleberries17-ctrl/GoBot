# GoBot keyboard macro
#
# Two independent mechanisms, usable together:
#
#   [Keys]      each key on its own repeating timer
#   [Sequence]  an ordered combo, key then pause then next
#
# Everything here is editable in the GUI's Macro tab; this file is just where
# it is kept.
#
# It ships with every key and the sequence switched off, so that a first
# start presses nothing. The keys are filled in: ticking a row on the simple
# screen is what turns one on.

[Macro]
timers_enabled=true
sequence_enabled=false
sequence_loop=true

# Only send input while the target window has focus. Leave this on. With it
# off, keys go to whatever window happens to be in front -- which will
# eventually be a browser, a chat client, or a document.
require_focus=true

# Bring the game to the front when the macro is switched on. Clicking START
# MACRO necessarily takes focus away from the game, and keys only ever go to a
# focused window -- so without this the macro starts and immediately sits there
# holding, which looks like it not working.
#
# Only on the way on. Keeping it in front during a run is refocus in [Simple]
# in app.ini, on by default: it brings the game back at once whenever another
# window takes it.
focus_on_start=true

# Added on top of each key's own jitter. Perfectly regular key timing is the
# clearest signal that a client is automated.
global_jitter_pct=0

# Win32 virtual-key codes. 121 = F10, 123 = F12.
# The panic key stops everything and releases every held key.
toggle_key=121
panic_key=123

# Skills that follow the fight: "Chỉ khi đang đánh quái" on the simple screen,
# and its "Kỹ năng" window. On, with the hunter running, the skill keys -- all
# but those with always_timer -- and the [Sequence] steps go only while it is
# attacking a monster in reach and facing it, never with MP under
# skill_mp_floor_pct, never with the character down, and each only when the
# monster is within its range_px. Off, or with no hunter running, every key
# keeps its own timer, as it always has. It ships off: it changes how an
# existing setup fights.
#   sequential_skills   GoC's "Dùng skill tuần tự": every skill whose cooldown
#                       is over goes, in key order, skill_gap_ms apart
#                       (30-1000); off, only the first of them, a chance
#                       every 300 ms
#   skill_mp_floor_pct  no skill under this much MP (0-50; 0 = never held)
skills_follow_fight=false
sequential_skills=true
skill_mp_floor_pct=10
skill_gap_ms=50

# Skills paced by your own casts in the packets (2026.11.08): the tick "Ra
# chiêu theo vòng (chờ game ra chiêu rồi mới bấm chiêu kế)" in the "Kỹ năng"
# window (Chi tiết… on the "Tự dùng kỹ năng" row), and in the full screen's
# Timed keys. On, with the skills on their own timers (not following the
# fight) and nothing else pressing keys (no hunter running, no key sequence):
# one round in the order of the keys, each skill once, the next key pressed
# only after the game has cast the one before -- your client's cast frame
# seen -- and its lock is over. A key's interval_ms is then only the least
# time between two of its casts. A key the game does not cast twice running
# is skipped that round, and its cooldown learned once that happens twice in
# a minute. With no cast of yours for 2 s while keys go out (out of the
# world, a town, the packets off), every key goes on its own timer until the
# next cast. Potions go first, as ever. Buffs keep their own timers, but one
# due while a skill's cast is waited for, or inside its lock, goes once that
# lock is over (usually under a second), and the next skill waits for the
# buff's cast. Off, and in a file without it: every key on its own timer, as
# always.
# (VI) Bấm kỹ năng theo nhịp chiêu ra: lần lượt từng chiêu theo thứ tự phím,
# chỉ bấm chiêu sau khi game đã ra chiêu trước (xem qua gói tin). Mặc định tắt.
cast_paced=false

# Keys the game does not take. The game reads its keyboard once a frame, so a
# key held for less than a frame is lost now and then -- the key goes down and
# up and nothing happens -- and more so the more keys the macro presses.
#   key_hold_min_ms / key_hold_max_ms
#       how long each key is held, a random time between the two, for a key
#       with no hold_ms of its own (20-500). 0 and 0: the short 25-60 ms of
#       earlier versions. A file without them gets 70 and 110.
#   potion_recheck_ms
#       a potion whose bar has not risen this long after its press (500-3000),
#       while it still wants to drink, is pressed again at once rather than
#       after its interval_ms: the game may have ignored the press. Once per
#       press; the log says "Potion check: ..." each time. 0: never. A file
#       without it gets 1000.
key_hold_min_ms=70
key_hold_max_ms=110
potion_recheck_ms=1000

# A potion whose bar is under HALF its mark (a 59% MP potion: under 29%) may
# drink again potion_urgent_ms after its last press, not after its whole
# interval_ms: skills that drain MP faster than one potion per 3 s makes up
# left the bot behind. Between the mark and half of it the interval stands.
# 500-5000; 0 = never sooner. A file without it gets 1000.
potion_urgent_ms=1000

# A buff is cast by pressing its key several times, as GoC does: 4 times, 200
# ms apart. The game drops a single press now and then, and a buff it dropped
# is gone for its whole interval -- a minute or five -- which looks like the
# buffs working sometimes. buff_presses 1 is the single press (1-6);
# buff_press_gap_ms 100-500. A file without them gets 4 and 200. The log says
# "Buff: key ... cast" at each cast, and why when one cannot be.
buff_presses=4
buff_press_gap_ms=200

[Keys]
# interval_ms   how often to press
# hold_ms       this key's own hold, in ms, at most 500 (more is read as
#               500): no key of the game is held down, every one is a press.
#               0 = the usual press, key_hold_min_ms to key_hold_max_ms
# start_delay_ms  initial offset, so timers do not all come due together
# jitter_pct    +/- randomisation applied to the interval each time
#
# trigger       always | hp_below | mp_below | pet_hp_below
# threshold_pct the percentage hp_below / mp_below / pet_hp_below compares
#               against
#
# pet_hp_below is the pet's HP: the red bar in the pet's slot on the HUD,
# under the HP and MP bars ("Tự bơm máu pet" on the simple screen). GoBot
# finds that bar by itself, so it has no place in [Vitals]; with no pet out,
# such a key holds, as any triggered key with no reading does.
#
# With a trigger set, interval_ms becomes the cooldown -- the shortest gap
# between two firings -- rather than the rate. The key is tested several times
# a second regardless, so the reaction is immediate.
#
# A triggered key with no HP/MP reading available holds rather than firing. The
# Macro tab says so when that happens; set the bars up on the HP / MP tab.
#
# With skills following the fight ([Macro] skills_follow_fight):
# always_timer  this skill keeps its own timer anyway, fight or no fight --
#               "Luôn bấm theo giờ", for a skill that is a buff on yourself
# range_px      how far to the side the monster may be for this skill to
#               reach it; 0 = any distance (GoC's aoe_max_x)
#
# buff          true: a buff ("Tự buff" on the simple screen) whatever its
#               interval_ms -- cast on its own clock, fight or no fight, and
#               again after a death, a revive or logging back in. 0 is as
#               often as a buff may go: every 5 s, as GoC casts a buff whose
#               cooldown is 0; nothing under 5 s is any sooner. false, or
#               missing: a key on a timer of a minute or more is a buff, and a
#               shorter one a skill.

key_0_label=Skill 1
key_0_keycode=90
key_0_enabled=false
key_0_interval_ms=1200
key_0_hold_ms=0
key_0_start_delay_ms=0
key_0_jitter_pct=10
key_0_always_timer=false
key_0_range_px=0

key_1_label=Skill 2
key_1_keycode=88
key_1_enabled=false
key_1_interval_ms=3000
key_1_hold_ms=0
key_1_start_delay_ms=150
key_1_jitter_pct=10
key_1_always_timer=false
key_1_range_px=0

key_2_label=Skill 3
key_2_keycode=67
key_2_enabled=false
key_2_interval_ms=6000
key_2_hold_ms=0
key_2_start_delay_ms=300
key_2_jitter_pct=10
key_2_always_timer=false
key_2_range_px=0

key_3_label=Skill 4
key_3_keycode=86
key_3_enabled=false
key_3_interval_ms=9000
key_3_hold_ms=0
key_3_start_delay_ms=450
key_3_jitter_pct=10
key_3_always_timer=false
key_3_range_px=0

key_4_label=Buff 1
key_4_keycode=51
key_4_enabled=false
