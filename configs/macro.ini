step_2_hold_ms=0
step_2_delay_after_ms=600

[Vitals]
# Where HP and MP are drawn, measured inside the game window's client area --
# not the screen -- so the numbers hold when you move the window.
#
# These were measured off a 1024x768 client and will be out at any other size.
# Press FIND THE BARS on the HP / MP tab and it works them out for itself; the
# numbers here are only a starting point.
#
# Note the height: only the middle rows of each bar are read. The bars are
# steep vertical gradients -- mana runs 0,8,123 at its top edge through
# 0,181,255 in the middle -- and the centre matches a single colour where the
# full height cannot.
#
# r/g/b is the colour of the filled part, matched within tolerance per channel.
# The fill is read as a prefix -- the scan stops at the first gap -- so a
# similarly coloured element further along the row is not counted.
enabled=true

hp_x=83
hp_y=8
hp_width=159
hp_height=5
hp_r=239
hp_g=0
hp_b=0
hp_tolerance=80

mp_x=83
mp_y=22
mp_width=159
mp_height=5
mp_r=0
mp_g=49
mp_b=206
mp_tolerance=80
